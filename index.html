/* ---------------- BOOT ---------------- */
async function boot() {
  const mode = await DB.open();
  ST.deviceId = DB.getMeta('deviceId', null);
  if (!ST.deviceId) { ST.deviceId = 'dev-' + uid().slice(-6); DB.setMeta('deviceId', ST.deviceId); }
  try { await loadBaseline(); }
  catch (e) { document.body.innerHTML = '<div style="padding:30px;font:14px Segoe UI">Could not load the baseline: ' + esc(e.message) + '</div>'; return; }

  Object.assign(CFG, { rag: DB.getMeta('rag', CFG.rag), noticeDays: DB.getMeta('noticeDays', 28), workDays: DB.getMeta('workDays', 6) });
  ST.dataDate = DB.getMeta('dataDate', iso());
  const uid_ = DB.getMeta('user', null);
  const U = users();
  ST.user = U.find(u => u.id === uid_) || null;
  if (ST.user && ST.user.role === 'engineer') ST.filters = { win: true };   // engineers start on the current window
  $('#boot').remove();
  $('#app').classList.remove('hide');
  $('#who').addEventListener('click', () => login());
  $('#stat').addEventListener('click', () => SYNC.now(true));
  $('#mclose').addEventListener('click', closeModal);
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  if (mode === 'mem') setTimeout(() => toast('This browser is not saving data locally — export a backup before closing.', true), 1500);
  SYNC.init();
  if (!ST.user) { render(); login(); } else render();
  window.addEventListener('resize', () => { clearTimeout(ST._rz); ST._rz = setTimeout(render, 350); });
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
document.addEventListener('DOMContentLoaded', boot);


/* ==== 55-xer-import.js ==== */
/* ============================================================
   55 — XER import (planner only)
   ------------------------------------------------------------
   Two importers, both reading a raw Primavera .xer in the browser:
   · REVISED BASELINE  — replaces the whole baseline register (dates,
     cost/qty loading, codes). Diff report first, curve basis asked
     per import (his call), distributed to every device via the server.
   · PROGRESS UPDATE   — reads Physical % at the XER data date and books
     it as ordinary progress records. HIGHER value governs by default;
     every mismatch vs the site reading is FLAGGED, with a per-row
     "force XER value" the planner ticks to correct downward.
   ============================================================ */

/* ---------- raw XER parser (same tables extract.py reads) ---------- */
function parseXER(text) {
  const T = {}; let cur = null;
  text.split(/\r?\n/).forEach(line => {
    const p = line.split('\t');
    if (p[0] === '%T') { cur = p[1]; T[cur] = { cols: null, rows: [] }; }
    else if (p[0] === '%F') { if (cur) T[cur].cols = p.slice(1); }
    else if (p[0] === '%R') { if (cur) T[cur].rows.push(p.slice(1)); }
  });
  const out = {};
  for (const k in T) {
    const c = T[k].cols || [];
    out[k] = T[k].rows.map(r => {
      const o = {};
      for (let i = 0; i < c.length; i++) o[c[i]] = r[i] !== undefined ? r[i] : '';
      return o;
    });
  }
  return out;
}
function xnum(x, d) { const v = parseFloat(x); return isFinite(v) ? v : (d || 0); }
function xdt(s) { return s ? s.slice(0, 10) : null; }

/* ---------- JS port of extract.py + slim.py → slim baseline ---------- */
function xerToSlim(T, label) {
  if (!T.TASK || !T.PROJECT) throw new Error('Not a valid XER — TASK / PROJECT tables missing.');
  const wbs = {}; (T.PROJWBS || []).forEach(r => wbs[r.wbs_id] = r);
  const wbsPath = wid => {
    const out = [], seen = {};
    while (wbs[wid] && !seen[wid]) {
      seen[wid] = 1;
      const n = wbs[wid];
      if (n.proj_node_flag !== 'Y') out.push(n.wbs_name);
      wid = n.parent_wbs_id;
    }
    return out.reverse();
  };
  const rsrc = {}; (T.RSRC || []).forEach(r => rsrc[r.rsrc_id] = r);
  const ctype = {}; (T.ACTVTYPE || []).forEach(r => ctype[r.actv_code_type_id] = r.actv_code_type);
  const acode = {}; (T.ACTVCODE || []).forEach(r => acode[r.actv_code_id] = r);
  const tCodes = {};
  (T.TASKACTV || []).forEach(r => {
    const ac = acode[r.actv_code_id]; if (!ac) return;
    const tn = ctype[r.actv_code_type_id] || r.actv_code_type_id;
    (tCodes[r.task_id] = tCodes[r.task_id] || {})[tn] = { s: ac.short_name, n: ac.actv_code_name };
  });
  const udft = {}; (T.UDFTYPE || []).forEach(r => udft[r.udf_type_id] = r.udf_type_label);
  const tUdf = {};
  (T.UDFVALUE || []).forEach(r => {
    const lbl = udft[r.udf_type_id]; if (!lbl) return;
    const v = r.udf_text || r.udf_number || r.udf_date;
    if (v) (tUdf[r.fk_id] = tUdf[r.fk_id] || {})[lbl] = v;
  });
  const assign = {};
  (T.TASKRSRC || []).forEach(r => (assign[r.task_id] = assign[r.task_id] || []).push(r));

  const acts = []; let totCost = 0;
  T.TASK.forEach(t => {
    const ar = assign[t.task_id] || [];
    let cost = 0, lab = 0, eqp = 0;
    const trades = {}, equips = {};
    ar.forEach(a2 => {
      cost += xnum(a2.target_cost);
      const q = xnum(a2.target_qty);
      const rr = rsrc[a2.rsrc_id] || {};
      if (a2.rsrc_type === 'RT_Labor') {
        lab += q;
        if (rr.rsrc_name && rr.rsrc_name !== 'Manpower') trades[rr.rsrc_name] = (trades[rr.rsrc_name] || 0) + q;
      } else if (a2.rsrc_type === 'RT_Equip') {
        eqp += q;
        if (rr.rsrc_name && rr.rsrc_name !== 'Equipment') equips[rr.rsrc_name] = (equips[rr.rsrc_name] || 0) + q;
      }
    });
    const cds = tCodes[t.task_id] || {}, u = tUdf[t.task_id] || {};
    const o = {
      i: t.task_code, n: t.task_name, w: wbsPath(t.wbs_id),
      es: xdt(t.early_start_date) || xdt(t.target_start_date),
      ef: xdt(t.early_end_date) || xdt(t.target_end_date),
      ls: xdt(t.late_start_date), lf: xdt(t.late_end_date),
      d: Math.round(xnum(t.target_drtn_hr_cnt) / 8 * 100) / 100,
      tf: Math.round(xnum(t.total_float_hr_cnt) / 8 * 100) / 100,
      c: Math.round(cost * 100) / 100,
      lh: Math.round(lab * 100) / 100, eh: Math.round(eqp * 100) / 100
    };
    if (t.task_type === 'TT_Mile' || t.task_type === 'TT_FinMile') o.ms = 1;
    if (u['Qty']) { const q2 = parseFloat(u['Qty']); if (isFinite(q2)) o.q = Math.round(q2 * 100) / 100; }
    if (u['Unit']) o.u = u['Unit'];
    if (u['Rate Of Prod.']) o.rt = u['Rate Of Prod.'];
    let hasTr = false, hasEq = false;
    for (const k in trades) { hasTr = true; trades[k] = Math.round(trades[k] * 100) / 100; }
    for (const k in equips) { hasEq = true; equips[k] = Math.round(equips[k] * 100) / 100; }
    if (hasTr) o.tr = trades;
    if (hasEq) o.eq = equips;
    const m = {}, mn = {};
    for (const k in cds) {
      const key = k.replace('R2200-', '');
      m[key] = cds[k].s;
      if (cds[k].n && cds[k].n !== cds[k].s) mn[key] = cds[k].n;
    }
    o.k = m;
    if (Object.keys(mn).length) o.kn = mn;
    totCost += o.c;
    acts.push(o);
  });
  const proj = T.PROJECT[0];
  const meta = {
    project: proj.proj_short_name, xer: label,
    data_date: xdt(proj.last_recalc_date),
    plan_start: xdt(proj.plan_start_date), scd_end: xdt(proj.scd_end_date),
    total_cost: Math.round(totCost * 100) / 100,
    code_types: Object.keys((() => { const s = {}; for (const k in ctype) s[ctype[k]] = 1; return s; })()).sort()
  };
  return { meta: meta, acts: acts };
}

/* ---------- shared: read a picked file ---------- */
function pickXER(onParsed) {
  const f = document.createElement('input');
  f.type = 'file'; f.accept = '.xer';
  f.addEventListener('change', async () => {
    const file = f.files[0]; if (!file) return;
    try {
      toast('Reading ' + file.name + ' …');
      const T = parseXER(await file.text());
      onParsed(T, file.name);
    } catch (e) { toast('Could not read that XER: ' + e.message, true); }
  });
  f.click();
}

/* ============================================================
   BASELINE IMPORT
   ============================================================ */
function importBaselineXER() {
  pickXER((T, fname2) => {
    let slim2;
    try { slim2 = xerToSlim(T, fname2); }
    catch (e) { return toast(e.message, true); }
    const cur = ST.BL, nw = {};
    slim2.acts.forEach(a => nw[a.i] = a);
    const added = slim2.acts.filter(a => !cur.byId[a.i]);
    const removed = cur.acts.filter(a => !nw[a.i]);
    let datesMoved = 0, costMoved = 0;
    slim2.acts.forEach(a => {
      const c = cur.byId[a.i]; if (!c) return;
      if (c.es !== a.es || c.ef !== a.ef || c.ls !== a.ls || c.lf !== a.lf) datesMoved++;
      if (Math.abs((c.c || 0) - (a.c || 0)) > 0.01) costMoved++;
    });
    const recs = DB.all('progress').filter(p => !p.void);
    const orphan = {} ; recs.forEach(p => { if (!nw[p.actId] && cur.byId[p.actId]) orphan[p.actId] = 1; });
    const orphanIds = Object.keys(orphan);
    const ms1170 = slim2.acts.find(a => a.i === 'GEN-MS-1170');

    const b = el('div');
    const kv = (k, v, warn) => b.appendChild(el('div', { class: 'kv' }, [el('span', {}, k),
      el('b', { style: warn ? 'color:#FF0000' : '' }, v)]));
    kv('File', fname2);
    kv('Project / data date', slim2.meta.project + ' · ' + dmy(slim2.meta.data_date));
    kv('Programme span', dmy(slim2.meta.plan_start) + ' → ' + dmy(slim2.meta.scd_end));
    kv('Activities', slim2.acts.length + '  (current ' + cur.acts.length + ')');
    kv('Added / removed', added.length + ' / ' + removed.length, removed.length > 0);
    kv('Dates moved / cost changed', datesMoved + ' / ' + costMoved);
    kv('Total cost loaded', aed(slim2.meta.total_cost) + '  (current ' + aed(cur.TOT) + ')',
      Math.abs(slim2.meta.total_cost - cur.TOT) > 1);
    if (orphanIds.length) kv('⚠ Progress records on activities NOT in the new file', orphanIds.length + ' activities — records are KEPT in the register but stop counting', true);
    if (ms1170) kv('GEN-MS-1170 cost in this file (known export defect on the original XER — verify)', aed(ms1170.c), ms1170.c < 17000000);

    if (removed.length) {
      const d2 = el('div', { class: 'scroll', style: 'max-height:130px;margin-top:6px;font-size:11px' });
      removed.slice(0, 200).forEach(a => d2.appendChild(el('div', {}, a.i + ' — ' + a.n)));
      b.appendChild(el('div', { class: 'mini', style: 'margin-top:8px' }, 'Removed activities:'));
      b.appendChild(d2);
    }

    /* curve basis — asked on EVERY baseline import (his call) */
    b.appendChild(el('div', { class: 'sep' }));
    b.appendChild(el('div', { style: 'font-weight:700;font-size:12.5px;margin-bottom:4px' }, 'Planned Early / Late curve basis for this baseline'));
    let basis = 'xer';
    const rb = (v, t, d2) => {
      const r = el('label', { class: 'row', style: 'gap:7px;align-items:flex-start;margin-bottom:5px;cursor:pointer' });
      const i = el('input', { type: 'radio', name: 'cbasis' });
      i.checked = v === basis;
      i.addEventListener('change', () => { if (i.checked) basis = v; });
      r.appendChild(i);
      r.appendChild(el('div', {}, [el('b', { style: 'font-size:12px' }, t), el('div', { class: 'mini' }, d2)]));
      return r;
    };
    b.appendChild(rb('xer', 'From this XER (its own dates + cost loading)', 'Planned %, curves and Planned-vs-Actual all follow the revised programme.'));
    b.appendChild(rb('issued', 'Keep the issued S-curve workbook (S Curve-Revised.xlsx)', 'Only right if the accepted curve still governs unchanged.'));
    b.appendChild(el('div', { class: 'note b', style: 'margin-top:8px' },
      'Applying replaces the baseline on THIS device and pushes it to the server — every engineer\'s device picks it up on the next sync. ' +
      'Site records are never deleted; they keep matching by Activity ID.'));

    modal('Import revised baseline — review before applying', b, [
      { t: 'Cancel', c: 'btn gh', f: closeModal },
      { t: 'Apply new baseline', c: 'btn p', f: async () => {
        closeModal();
        try { await applyBaselineOverride(slim2, basis, fname2); toast('Baseline replaced — ' + fname2 + ' now governs.'); }
        catch (e) { toast('Import failed: ' + e.message, true); }
      } }
    ]);
  });
}

async function applyBaselineOverride(slim2, basis, label) {
  const rawTxt = JSON.stringify(slim2);
  const b64 = await gzipToB64(rawTxt);
  const ov = { ver: Date.now() + '-' + label, basis: basis, label: label,
    at: iso(), by: ST.user ? ST.user.id : '', pushed: false };
  if (b64) ov.b64 = b64; else ov.raw = rawTxt;
  DB.setMeta('blOverride', ov);
  await reloadBaselineInPlace();
  SYNC.pushBaseline();     // fire-and-forget; retried on every sync while unpushed
}

async function reloadBaselineInPlace() {
  await loadBaseline();
  resetDerived();
  render(); renderTop();
}

/* ============================================================
   PROGRESS IMPORT (Physical %)
   ============================================================ */
function importProgressXER() {
  pickXER((T, fname2) => {
    if (!T.TASK || !T.PROJECT) return toast('Not a valid XER — TASK / PROJECT tables missing.', true);
    const dd = xdt(T.PROJECT[0].last_recalc_date) || iso();
    const ix = actualIndex();             // site reading BEFORE import (all records)
    const rows = [], unmatched = [];
    T.TASK.forEach(t => {
      let xp = xnum(t.phys_complete_pct);
      if (t.status_code === 'TK_Complete') xp = 100;
      xp = Math.min(100, Math.max(0, xp));
      const a = ST.BL.byId[t.task_code];
      if (!a) { if (xp > 0) unmatched.push(t.task_code); return; }
      const app = ix[t.task_code] ? ix[t.task_code].a : 0;
      /* a conflict needs BOTH a site reading and a differing XER value —
         XER progress on an activity the site never touched is just new data */
      rows.push({ id: t.task_code, n: a.n, app: app, xer: xp,
        conflict: app > 0.05 && Math.abs(app - xp) > 0.05,
        siteHigher: app - xp > 0.05, force: false });
    });
    const withProg = rows.filter(r => r.xer > 0.05);
    const conflicts = rows.filter(r => r.conflict);

    const b = el('div');
    const kv = (k, v, warn) => b.appendChild(el('div', { class: 'kv' }, [el('span', {}, k),
      el('b', { style: warn ? 'color:#FF0000' : '' }, v)]));
    kv('File / XER data date', fname2 + ' · ' + dmy(dd));
    kv('Activities with Physical % in the file', String(withProg.length));
    kv('Matched to the baseline', rows.length + ' of ' + T.TASK.length);
    if (unmatched.length) kv('⚠ Progressed activities NOT in the baseline (skipped)', String(unmatched.length), true);
    kv('Conflicts — site reading ≠ XER %', String(conflicts.length), conflicts.length > 0);

    b.appendChild(el('div', { class: 'note b', style: 'margin-top:8px' },
      '<b>Rule (your call):</b> the HIGHER of the two governs and every mismatch below is flagged. ' +
      'Tick <b>Force XER</b> on a row to make the XER value authoritative — it then corrects the reading ' +
      'DOWN as well, and site entries dated after ' + dmy(dd) + ' build on top of it. Nothing is deleted; ' +
      'the audit log keeps every entry.'));

    if (conflicts.length) {
      const tw = el('div', { class: 'tw scroll', style: 'max-height:260px;margin-top:8px' });
      const tb = el('table', {});
      const thr = el('tr', {});
      ['Activity', 'Site %', 'XER %', 'Higher', 'Force XER'].forEach((h, i2) =>
        thr.appendChild(el('th', { class: i2 ? 'n' : '' }, h)));
      tb.appendChild(el('thead', {}, thr));
      const tbody = el('tbody', {});
      conflicts.forEach(r => {
        const tr = el('tr', { style: r.siteHigher ? 'background:#FDEFE4' : '' });
        tr.appendChild(el('td', { style: 'font-size:11px' }, r.id + ' — ' + r.n));
        tr.appendChild(el('td', { class: 'n' }, n2(r.app)));
        tr.appendChild(el('td', { class: 'n' }, n2(r.xer)));
        tr.appendChild(el('td', { class: 'n', style: r.siteHigher ? 'color:#D2600F;font-weight:700' : '' },
          r.siteHigher ? 'SITE' : 'XER'));
        const cb = el('input', { type: 'checkbox' });
        cb.addEventListener('change', () => r.force = cb.checked);
        const td = el('td', { class: 'n' }); td.appendChild(cb);
        tr.appendChild(td);
        tbody.appendChild(tr);
      });
      tb.appendChild(tbody); tw.appendChild(tb);
      b.appendChild(tw);
      b.appendChild(el('button', { class: 'btn sm', style: 'margin-top:6px', onclick: (ev) => {
        conflicts.forEach(r => { if (r.siteHigher) r.force = true; });
        tw.querySelectorAll('tbody tr').forEach((tr, i2) => {
          const cb = tr.querySelector('input'); if (cb && conflicts[i2]) cb.checked = conflicts[i2].force;
        });
      } }, 'Tick all rows where SITE is higher (accept the XER correction)'));
    }

    modal('Import progress XER — review before applying', b, [
      { t: 'Cancel', c: 'btn gh', f: closeModal },
      { t: 'Import', c: 'btn p', f: () => {
        closeModal();
        let n = 0, nf = 0;
        rows.forEach(r => {
          const mustWrite = r.force || (r.xer > 0.05 && r.xer - r.app > 0.05);
          if (!mustWrite) return;
          const rec = { id: uid(), date: dd, actId: r.id, pct: r.xer, mode: 'pct',
            area: (ST.BL.byId[r.id] || {}).area || '', user: ST.user ? ST.user.id : '',
            dev: ST.deviceId, src: 'xer', note: 'Imported from ' + fname2 + (r.force ? ' (forced — XER governs)' : ''),
            rev: Date.now() };
          if (r.force) rec.ov = 1;
          DB.put('progress', rec);
          n++; if (r.force) nf++;
        });
        DB.setMeta('dataDate', dd); ST.dataDate = dd;
        SYNC.schedule();
        render();
        toast('Imported ' + n + ' progress record(s) from ' + fname2 +
          (nf ? ' (' + nf + ' forced to the XER value)' : '') + ' · data date set to ' + dmy(dd));
      } }
    ]);
  });
}

/* ---------- Setup card ---------- */
function xerImportCard() {
  const c = el('div', { class: 'card', style: 'margin-top:12px' }, [el('h3', {}, 'Import XER — baseline / progress')]);
  const ov = ST.BL.override;
  c.appendChild(el('div', { class: 'note b', style: 'margin-bottom:9px' },
    'Baseline in force: <b>' + esc(ST.BL.meta.xer) + '</b>' +
    (ov ? ' — imported ' + dmy(ov.at) + ' by ' + esc(ov.by || '?') + ' · planned basis: <b>' +
      (ov.basis === 'xer' ? 'from the imported XER' : 'issued S-curve workbook') + '</b>'
        : ' (built-in) · planned basis: issued S-curve workbook')));
  const g = el('div', { class: 'grid g2' });
  g.appendChild(el('div', {}, [
    el('button', { class: 'btn p', onclick: importBaselineXER }, '⬆ Import REVISED BASELINE XER'),
    el('div', { class: 'mini', style: 'margin-top:5px' },
      'Replaces activities, planned dates and cost/qty loading. Shows the full diff first, asks the planned-curve ' +
      'basis each time, then pushes the new baseline to every device through the server. Site records are kept ' +
      'and keep matching by Activity ID.')]));
  g.appendChild(el('div', {}, [
    el('button', { class: 'btn p', onclick: importProgressXER }, '⬆ Import PROGRESS-UPDATED XER'),
    el('div', { class: 'mini', style: 'margin-top:5px' },
      'Reads Physical % at the XER data date and books it as progress records — drawings, dashboards and layouts ' +
      'update immediately. Higher of site/XER governs; every mismatch is flagged with a per-row "Force XER" for ' +
      'downward corrections. Sets the app data date to the XER data date.')]));
  c.appendChild(g);
  if (ov) c.appendChild(el('button', { class: 'btn sm', style: 'margin-top:9px', onclick: () =>
    ask('Revert to the built-in baseline', 'This device goes back to the baseline shipped inside the app (' +
      '523-25-Final for Submission). The server copy is not touched — the next sync will re-adopt the server ' +
      'baseline unless it is cleared there too. Continue?', async () => {
        DB.setMeta('blOverride', null); await reloadBaselineInPlace(); toast('Built-in baseline restored on this device');
      }, 'Revert') }, 'Revert this device to the built-in baseline'));
  return c;
}
