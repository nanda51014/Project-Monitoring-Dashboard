const SI_MEM = STAGES.findIndex(s => s.k === 'mem');
function stageOf(a) {
  const d = a.disc || '', n = a.n || '';
  /* blinding-level membrane + protection screed OVERRIDE the generic type-of-work
     code: the footing's "2-ply waterproofing membrane (Bottom slab)" is coded
     Waterproofing (a late stage) and the "50mm screed" is coded Concrete —
     both sit ON THE BLINDING, before reinforcement. Name governs here. */
  if (/membrane|screed|2-ply/i.test(n)) return SI_MEM;
  for (let i = 0; i < STAGES.length; i++) if (STAGES[i].m.test(d)) return i;
  for (let i = 0; i < STAGES.length; i++) if (STAGES[i].m.test(n)) return i;
  return -1;
}

/* ---------- structural model (built once, statuses computed per render) ---------- */
let _SM = null;
function structModel() {
  if (_SM) return _SM;
  /* ORIENTATION (Rev 5.7, per the All-Bridges-In-One sheet Rev.01/02):
     B1 and B2 run A2 → A1 left-to-right (sheet "Order (L→R): A2–P1–A1" and
     "A2–P6…P1–A1"); B3 runs A1 → A2. Arrays are in DRAWING order (left→right);
     span keys are unchanged — only their physical position mirrors. */
  const BRIDGES = [
    { id: 'B1', title: 'BRIDGE 01 — BRAK', supports: ['Abutment-02', 'Pier-1', 'Abutment-01'],
      spans: [['BRAK', 'Span-02'], ['BRAK', 'Span-01']],
      secOf: ['BRAK'], secSpan: { BRAK: [0, 2] } },
    { id: 'B2', title: 'BRIDGE 02 — RG AK-1 + RG AK-2',
      supports: ['Abutment-02', 'Pier-6', 'Pier-5', 'Pier-4', 'Pier-3', 'Pier-2', 'Pier-1', 'Abutment-01'],
      spans: [['RG AK-2', 'Span-03'], ['RG AK-2', 'Span-02'], ['RG AK-2', 'Span-01'],
              ['RG AK-1', 'Span-04'], ['RG AK-1', 'Span-03'], ['RG AK-1', 'Span-02'], ['RG AK-1', 'Span-01']],
      secOf: ['RG AK-1', 'RG AK-2'], secSpan: { 'RG AK-1': [3, 7], 'RG AK-2': [0, 3] } },
    { id: 'B3', title: 'BRIDGE 03 — AK RG-1 + AK RG-2 + AK RG-3',
      supports: ['Abutment-01', 'Pier-1', 'Pier-2', 'Pier-3', 'Pier-4', 'Pier-5', 'Pier-6', 'Pier-7', 'Pier-8', 'Abutment-02'],
      spans: [['AK RG-1', 'Span-01'], ['AK RG-1', 'Span-02'], ['AK RG-1', 'Span-03'],
              ['AK RG-2', 'Span-01'], ['AK RG-2', 'Span-02'],
              ['AK RG-3', 'Span-01'], ['AK RG-3', 'Span-02'], ['AK RG-3', 'Span-03'], ['AK RG-3', 'Span-04']],
      secOf: ['AK RG-1', 'AK RG-2', 'AK RG-3'],
      secSpan: { 'AK RG-1': [0, 3], 'AK RG-2': [3, 5], 'AK RG-3': [5, 9] } }
  ];
  /* pile ≠ pile extension (pile stops at GL; extension runs GL → header beam soffit),
     and the pier column family splits shaft / flare / head by activity name */
  const SUPP_ELEM = { pile: /^Pile$/, pext: /^Pile Extension$/, cap: /^(Pile Cap|Header Beam)$/,
    ber: /^Bearings$/, bw: /^Back Wall$/,
    as: /^(Approach slab|Approach Slab)$/, ej: /^Expansion Joints$/ };

  BRIDGES.forEach(B => {
    /* CON- only: this view is structural progress — shop drawings / design
       submittals (ENG-) live in the Engineering register, not on the drawing */
    const acts = ST.BL.acts.filter(a => a.k.Bridges === B.id && a.i.indexOf('CON-') === 0 && !/^Ramp/.test(a.loc || ''));
    B.supp = {}; B.deck = {}; B.pt = {}; B.other = [];
    B.supports.forEach(s => B.supp[s] = { pile: [], pext: [], cap: [], shaft: [], flare: [], head: [], ber: [], bw: [], as: [], ej: [] });
    B.spans.forEach(([sec, sp]) => B.deck[sec + '|' + sp] = []);
    B.secOf.forEach(sec => B.pt[sec] = []);
    acts.forEach(a => {
      const loc = a.loc || '', elem = a.elem || '', sec = a.sec || '';
      if (elem === 'Post Tensioning' || elem === 'Tendon Duct' || /tendon|post.?tension|stressing/i.test(a.n)) {
        const s = B.pt[sec] ? sec : B.secOf[0]; B.pt[s].push(a); return;
      }
      /* deck acts: the ID's span token governs over the Element Location code —
         two acts in the XER are miscoded (Web Formwork S1/S2 coded Span-03, flag F-10) */
      const idSp = a.i.match(/-S(\d)-DS-/);
      const spanLoc = idSp ? 'Span-0' + idSp[1] : loc;
      if (/^Span-/.test(spanLoc)) {                   // deck + gantry/scaffold acts on a span
        const key = (B.deck[sec + '|' + spanLoc] ? sec : B.secOf[0]) + '|' + spanLoc;
        (B.deck[key] = B.deck[key] || []).push(a); return;
      }
      if (B.supp[loc]) {
        const g = B.supp[loc];
        for (const k in SUPP_ELEM) if (SUPP_ELEM[k].test(elem)) { g[k].push(a); return; }
        /* pier column family (Pier Column / Piers / Pier Head codes) → by name */
        if (elem === 'Pier Head' || /pier head/i.test(a.n)) g.head.push(a);
        else if (/\bfla(?:re|ir)\b/i.test(a.n)) g.flare.push(a);
        else g.shaft.push(a);                         // shaft + shop drawings + uncoded support acts
        return;
      }
      if (elem === 'Deck Slab') {                     // section-level deck rollups, no span code
        B.other.push(a); return;
      }
      B.other.push(a);
    });
  });

  /* ---- underpass / box culvert ---- */
  const cul = ST.BL.acts.filter(a => a.w.join('/').toLowerCase().indexOf('culvert') >= 0 && a.i.indexOf('CON-') === 0);
  const secTok = a => (a.i.match(/-S(\d)-/) ? 'Section-0' + a.i.match(/-S(\d)-/)[1] :
    (/Section-01/.test(a.w.join('/')) ? 'Section-01' : /Section-02/.test(a.w.join('/')) ? 'Section-02' : ''));
  const UP = { title: 'UNDERPASS — BOX CULVERT', sections: ['Section-01', 'Section-02'], g: {} };
  ['Section-01', 'Section-02'].forEach(s => UP.g[s] = { base: [], wall: [], top: [] });
  UP.as = []; UP.fill = []; UP.fin = [];
  cul.forEach(a => {
    const e = a.elem || '', s = secTok(a);
    if (/Base Slab/i.test(e)) (UP.g[s] || UP.g['Section-01']).base.push(a);
    else if (/Wall/i.test(e)) (UP.g[s] || UP.g['Section-01']).wall.push(a);
    else if (/Top slab/i.test(e)) (UP.g[s] || UP.g['Section-01']).top.push(a);
    else if (/Approach/i.test(e)) UP.as.push(a);
    else if (/Filling/i.test(e)) UP.fill.push(a);
    else UP.fin.push(a);
  });
  _SM = { BRIDGES: BRIDGES, UP: UP };
  return _SM;
}

/* ---------- group status ---------- */
function groupStatus(acts, ix, stageFn, stageList) {
  if (!acts || !acts.length) return null;
  const SF = stageFn || stageOf, SL = stageList || STAGES;
  let allDone = true, any = false, cur = -1, curDone = true;
  let cw = 0, cs = 0, n = 0, ps = 0;
  acts.forEach(a => {
    const v = ix[a.i] ? ix[a.i].a : 0;
    const w = a.c > 0 ? a.c : 0;
    cw += w; cs += w * v; n++; ps += v;
    if (v < 99.995) allDone = false;
    if (v > 0) {
      any = true;
      const si = SF(a);
      if (si > cur || (si === cur && v < 99.995)) { cur = si; curDone = v >= 99.995; }
    }
  });
  const pct = cw > 0 ? cs / cw : ps / n;
  if (allDone) return { fill: ST_DONE, done: true, pct: 100, label: 'Complete', hatch: false };
  if (!any) return { fill: ST_NOT, done: false, pct: 0, label: 'Not started', hatch: false, empty: true };
  const s = cur >= 0 ? SL[cur] : null;
  return { fill: s ? s.c : '#888', done: false, pct: pct, hatch: !curDone,
    label: (s ? s.t : 'In progress') + (curDone ? ' done' : ' in progress') };
}

/* ---------- svg helpers ---------- */
const SVGNS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, parent) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function paintEl(node, stt, gid, title) {
  if (!stt) { node.setAttribute('fill', '#F7F4F1'); node.setAttribute('stroke', ST_NOT_BORD); return; }
  node.setAttribute('fill', stt.hatch ? 'url(#hz-' + colId(stt.fill) + ')' : stt.fill);
  node.setAttribute('stroke', stt.empty ? ST_NOT_BORD : '#112528');
  node.setAttribute('stroke-width', stt.empty ? 1 : 1.2);
  if (gid != null) {
    node.style.cursor = 'pointer';
    node.addEventListener('click', () => structDetail(gid, title));
    const t = sv('title', {}, node);
    t.textContent = title + ' — ' + stt.label + ' · ' + n2(stt.pct) + '%';
  }
}
let _hpat = {};
function colId(c) { return c.replace('#', ''); }
function ensurePattern(svg, color) {
  const id = 'hz-' + colId(color);
  if (svg.querySelector('#' + id)) return;
  let defs = svg.querySelector('defs') || sv('defs', {}, svg);
  const p = sv('pattern', { id: id, width: 7, height: 7, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, defs);
  sv('rect', { width: 7, height: 7, fill: '#FFFFFF' }, p);
  sv('rect', { width: 4.2, height: 7, fill: color }, p);
}

/* the registry that click handlers resolve against */
let _SG = {};
/* true while rendering a PLANNED copy of a drawing (Planned-vs-Actual view):
   member markers (actual pile ticks) are ignored and member counts come from
   the planned % instead — floored, never overstated */
let _PIX = false;
function regGroup(acts, title) { const id = 'g' + Object.keys(_SG).length; _SG[id] = { acts: acts, title: title }; return id; }

/* ---------- individual members (pile 1 of 2, extension 2 of 2 …) ----------
   The XER loads piling / pile-extension as N nr per support (abutment 2+2,
   pier 4). Each drawn member is selectable on its own: marking one complete
   colours it and books a 1-nr share on the group's quantity-loaded
   activities. Markers are ordinary synced records — undo = void. */
function memberMarker(mkey, midx) {
  let best = null;
  DB.all('progress').forEach(p => {
    if (p.mode === 'member' && p.mkey === mkey && p.midx === midx && !p.void) {
      if (!best || (p.date + '|' + (p.rev || 0)) > (best.date + '|' + (best.rev || 0))) best = p;
    }
  });
  return best;
}
function memberDoneCount(mkey, N) { let c = 0; for (let i = 1; i <= N; i++) if (memberMarker(mkey, i)) c++; return c; }

function markMember(acts, mkey, midx, N, label, after) {
  const ix = actualIndex();
  const marker = DB.put('progress', { actId: acts[0].i, date: ST.progDate || iso(), mode: 'member',
    mkey: mkey, midx: midx, area: acts[0].area, note: label + ' marked complete' });
  const doneN = memberDoneCount(mkey, N);
  acts.forEach(a => {
    const o = ix[a.i];
    if (a.q) {                                   // book the 1/N share, capped at what remains
      const share = a.q / N, rem = Math.max(0, a.q - (o ? o.qty : 0));
      const qv = Math.min(share, rem);
      if (qv > 0.0005) DB.put('progress', { actId: a.i, date: ST.progDate || iso(), mode: 'qty',
        qty: qv, unit: a.u, area: a.area, note: label, mref: marker.id });
    } else {                                     // %-only act: lift to done/N — never downwards
      const target = doneN / N * 100, cur = o ? o.a : 0;
      if (target > cur + 0.005) DB.put('progress', { actId: a.i, date: ST.progDate || iso(), mode: 'pct',
        pct: target, area: a.area, note: label, mref: marker.id });
    }
  });
  toast(label + ' marked complete — 1/' + N + ' share booked');
  after && after();
}
function unmarkMember(mkey, midx, after) {
  const mk = memberMarker(mkey, midx);
  if (!mk) return;
  const me = (ST.user && ST.user.id) || '';
  DB.all('progress').forEach(p => {
    if (p.mref === mk.id && !p.void) { p.void = 1; p.voidReason = 'member mark removed'; p.voidBy = me; p.voidDate = iso(); DB.put('progress', p); }
  });
  mk.void = 1; mk.voidReason = 'unmarked'; mk.voidBy = me; mk.voidDate = iso(); DB.put('progress', mk);
  toast('Mark removed — its booked share voided with it');
  after && after();
}

function memberDetail(acts, mkey, midx, N, sup, kind) {
  const label = sup + ' — ' + kind + ' ' + midx + ' of ' + N;
  const mk = memberMarker(mkey, midx);
  const stt = groupStatus(acts, actualIndex());
  const b = el('div');
  b.appendChild(el('div', { class: 'note b' },
    (mk ? '✓ Marked complete ' + dmy(mk.date) + ' by ' + (mk.user || '') : 'Not marked complete') +
    ' · group ' + n2(stt ? stt.pct : 0) + '% · ' + memberDoneCount(mkey, N) + ' of ' + N + ' marked'));
  b.appendChild(el('div', { class: 'note', style: 'margin-top:6px' },
    'Marking this ' + kind.toLowerCase() + ' books a 1/' + N + ' share (1 nr) on each of the group\'s ' +
    'quantity-loaded activities — it shows in the audit log and can be undone (void). For partial work ' +
    '(cast but not cured, etc.) use the activity list and enter against the specific activity.'));
  const btns = [{ t: 'Close', c: 'btn', f: () => { closeModal(); if (ST.view === 'struct') render(); } }];
  btns.push({ t: 'Activity list', c: 'btn', f: () => { closeModal(); structDetail({ acts: acts, title: sup + ' — ' + kind + 's' }); } });
  if (canEdit() && inScope(acts[0])) {
    if (mk) btns.push({ t: 'Unmark (void)', c: 'btn', f: () => unmarkMember(mkey, midx, () => { closeModal(); render(); }) });
    else btns.push({ t: '✓ Mark complete', c: 'btn p', f: () => markMember(acts, mkey, midx, N, label, () => { closeModal(); render(); }) });
  }
  modal(label, b, btns);
}

/* Element popup — activity list in cycle order, with DIRECT ENTRY per row.
   Saving re-renders the layout underneath and reopens the popup, so the
   element recolours immediately. */
function structDetail(gidOrObj, title) {
  const g = typeof gidOrObj === 'string' ? _SG[gidOrObj] : gidOrObj;
  if (!g) return;
  const ix = actualIndex();
  const b = el('div');

  b.appendChild(el('div', { class: 'note b', style: 'margin-bottom:9px' },

    (canEdit() ? ' — enter qty or % and Save, or ✓ to complete an activity' : '')));

  const head = ['Activity ID', 'Description', 'Stage', { t: 'Plan %', n: 1 }, { t: 'Act %', n: 1 }];
  if (canEdit()) head.push('Update (today)');
  const rows = g.acts.slice().sort((x, y) => (x.es || '') < (y.es || '') ? -1 : 1).map(a => {
    const o = ix[a.i], v = o ? o.a : 0, p = plannedPct(a, ST.dataDate, false);
    const si = stageOf(a);
    const cells = [{ v: a.i, cls: 'mono' }, esc(a.n) +
        (a.q ? '<br><span class="mini">' + n2(o ? o.qty : 0) + ' / ' + n2(a.q) + ' ' + esc(a.u || '') + '</span>' : ''),
      si >= 0 ? '<span class="tag" style="background:' + STAGES[si].c + '22;color:#112528">' + STAGES[si].t + '</span>' : '',
      { v: n2(p), n: 1 }, { v: n2(v), n: 1, cls: v < p ? 'neg' : '' }];
    if (canEdit()) {
      if (inScope(a)) {
        const est = { qty: '', pct: '', note: '' };
        const reopen = () => { render(); structDetail(g, title); };
        const parts = [];
        const nQty = a.q ? el('input', { type: 'number', class: 'yel',
          placeholder: (a.u || 'qty') + ' today', title: 'Quantity done today (' + (a.u || '') + ')',
          style: 'width:96px;padding:6px 7px' }) : null;
        if (nQty) { nQty.addEventListener('input', () => est.qty = nQty.value);
          nQty.addEventListener('click', e => e.stopPropagation()); parts.push(nQty); }
        const nPct = el('input', { type: 'number', class: 'yel', placeholder: 'cum. %',
          title: 'Cumulative % complete', style: 'width:76px;padding:6px 7px' });
        nPct.addEventListener('input', () => est.pct = nPct.value);
        nPct.addEventListener('click', e => e.stopPropagation());
        parts.push(nPct);
        parts.push(el('button', { class: 'btn sm p', onclick: e => {
          e.stopPropagation();
          const hasQ = est.qty !== '' && isFinite(parseFloat(est.qty));
          const hasP = est.pct !== '' && isFinite(parseFloat(est.pct));
          if (hasQ && hasP) { toast('Fill quantity OR % — not both', true); return; }
          if (!hasQ && !hasP) { toast('Enter a quantity or a %', true); return; }
          est.mode = hasQ ? 'qty' : 'pct';
          saveProgress(a, est, o, ST.progDate || iso(), reopen);
        } }, 'Save'));
        if (v < 99.995) parts.push(el('button', { class: 'btn sm', title: 'Mark this activity complete', onclick: e => {
          e.stopPropagation();
          const fin = a.q && (o ? o.qty : 0) < a.q
            ? { mode: 'qty', qty: String(Math.max(0, a.q - (o ? o.qty : 0))), note: 'completed via layout' }
            : { mode: 'pct', pct: '100', note: 'completed via layout' };
          saveProgress(a, fin, o, ST.progDate || iso(), reopen);
        } }, '✓'));
        cells.push({ v: el('div', { class: 'row', style: 'gap:5px;flex-wrap:nowrap;align-items:center' }, parts) });
      } else cells.push('<span class="mini">outside your scope</span>');
    }
    return { cells: cells, onclick: () => actDetail(a) };
  });
  b.appendChild(table(head, rows, { scroll: 1 }));
  modal(g.title || title, b, [{ t: 'Close', c: 'btn', f: () => { closeModal(); if (ST.view === 'struct') render(); } }]);
  $('#mbox').style.maxWidth = '960px';
}

/* ---------- drawing one bridge — 3D isometric like the All-Bridges sheet ---------- */
function drawBridge(parent, B, ix) {
  setIso([0.94, -0.18], [0.36, 0.22]);
  const NS = B.supports.length;
  const uSpan = NS <= 3 ? 150 : Math.min(96, 880 / (NS - 1));
  const uEnd = (NS - 1) * uSpan;
  const wv = 46;                                       // deck width across (v)
  const X0 = 48, rise = uEnd * 0.18;
  const H = Math.round(rise + 250);
  const Y0 = H - 78;
  const W = Math.round(X0 + uEnd * 0.94 + (wv + 46) * 0.36 + 150);
  const wrap = el('div', { style: 'overflow-x:auto' });
  const svg = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, width: '100%',
    style: 'min-width:' + Math.min(W, 1150) + 'px;max-width:' + Math.round(W * 1.2) + 'px;display:block;margin:0 auto' });
  wrap.appendChild(svg); parent.appendChild(wrap);
  STAGES.forEach(s => ensurePattern(svg, s.c)); ensurePattern(svg, ST_DONE);

  const U = i => i * uSpan;
  const P = (u, v, w) => isoP(X0, Y0, u, v, w);
  /* heights (w): GL = 0. Piles live below GL; pier stack ends under the bearings. */
  const wPileB = -46, wCapB = -16, wTop = 78, wBerT = 86, wDeckT = 112, hFl = 26, hHd = 13;

  /* ground plane */
  const gp = [P(-34, -26, 0), P(uEnd + 34, -26, 0), P(uEnd + 34, wv + 42, 0), P(-34, wv + 42, 0)];
  sv('polygon', { points: gp.map(p => p.join(',')).join(' '), fill: '#E9E0D1',
    stroke: '#C9BFB4', 'stroke-width': 1, 'stroke-dasharray': '6 4' }, svg);
  sv('text', { x: gp[3][0] + 4, y: gp[3][1] - 4, 'font-size': 8.5, fill: '#8a8072' }, svg).textContent = 'GL';

  const halo = (x, y, t, sz, anchor) => sv('text', { x: x, y: y, 'font-size': sz || 9,
    'text-anchor': anchor || 'middle', fill: '#5B493C', stroke: '#fff', 'stroke-width': 3,
    'paint-order': 'stroke', 'font-weight': 600 }, svg).textContent = t;

  /* tapered frustum for the pier flare — narrow at the shaft, flowing out to the
     deck soffit, like the 3D progress drawing */
  const frustum = (u, uhB, uhT, vB0, vB1, vT0, vT1, w0, w1, fill, hatch, gid, title, stt) => {
    const Q = (uu, vv, ww) => P(uu, vv, ww).join(',');
    const faces = [
      { pts: [Q(u + uhB, vB0, w0), Q(u + uhB, vB1, w0), Q(u + uhT, vT1, w1), Q(u + uhT, vT0, w1)], f: darker(fill, .72) },
      { pts: [Q(u - uhB, vB0, w0), Q(u - uhB, vB1, w0), Q(u - uhT, vT1, w1), Q(u - uhT, vT0, w1)], f: darker(fill, .78) },
      { pts: [Q(u - uhB, vB1, w0), Q(u + uhB, vB1, w0), Q(u + uhT, vT1, w1), Q(u - uhT, vT1, w1)], f: darker(fill, .86) },
      { pts: [Q(u - uhT, vT0, w1), Q(u + uhT, vT0, w1), Q(u + uhT, vT1, w1), Q(u - uhT, vT1, w1)], f: fill, top: true }
    ];
    const grp = sv('g', {}, svg);
    faces.forEach(fc => {
      const pg = sv('polygon', { points: fc.pts.join(' '), stroke: '#112528', 'stroke-width': 0.8 }, grp);
      pg.setAttribute('fill', fc.top && hatch ? 'url(#hz-' + colId(fill) + ')' : fc.f);
    });
    if (gid != null) {
      grp.style.cursor = 'pointer';
      grp.addEventListener('click', () => structDetail(gid, title));
      const t = sv('title', {}, grp);
      t.textContent = title + (stt ? ' — ' + stt.label + ' · ' + n2(stt.pct) + '%' : '');
    }
  };

  const ejDefer = [];
  /* supports far → near, each built bottom-up */
  for (let i = NS - 1; i >= 0; i--) {
    const s = B.supports[i], g = B.supp[s], u = U(i), isAb = /^Abutment/.test(s), dir = i === 0 ? -1 : 1;
    const multi = (boxes, acts, label) => {
      if (!acts || !acts.length) return null;
      const stt = groupStatus(acts, ix), gid = regGroup(acts, B.id + ' · ' + s + ' — ' + label);
      boxes.forEach(b2 => isoBox(svg, X0, Y0, u + b2[0], u + b2[1], b2[2], b2[3], b2[4], b2[5],
        stt.empty ? ST_NOT : stt.fill, stt.hatch, gid, s + ' — ' + label, stt));
      return stt;
    };
    /* individually selectable members — one box per pile / extension */
    const members = (boxes, acts, kind, suffix) => {
      if (!acts || !acts.length) return null;
      const stt = groupStatus(acts, ix), mkey = B.id + '|' + s + '|' + suffix, N = boxes.length;
      const pDone = _PIX ? Math.min(N, Math.floor(N * stt.pct / 100 + 1e-9)) : 0;
      boxes.forEach((b2, bi) => {
        const done2 = _PIX ? (bi + 1 <= pDone) : !!memberMarker(mkey, bi + 1);
        const grp = isoBox(svg, X0, Y0, u + b2[0], u + b2[1], b2[2], b2[3], b2[4], b2[5],
          done2 ? ST_DONE : (stt.empty ? ST_NOT : stt.fill), done2 ? false : stt.hatch, null, '', null);
        grp.style.cursor = 'pointer';
        grp.addEventListener('click', () => memberDetail(acts, mkey, bi + 1, N, s, kind));
        const tt = sv('title', {}, grp);
        tt.textContent = s + ' — ' + kind + ' ' + (bi + 1) + ' of ' + N + (done2 ? ' · marked complete' : '') +
          ' · group ' + stt.label + ' ' + n2(stt.pct) + '%';
      });
      return { stt: stt, done: _PIX ? pDone : memberDoneCount(mkey, N), N: N };
    };
    if (isAb) {
      /* piles and extension are SEPARATE members: slim pile stubs stop below the
         GL collar (pile-cap level), the wider extension columns rise from it */
      const rP = members([[-4, 4, 10, 18, wPileB, -6], [-4, 4, wv - 18, wv - 10, wPileB, -6]], g.pile, 'Pile', 'pile');
      [[6, 22], [wv - 22, wv - 6]].forEach(vv =>                       // GL collar (pile-cap level)
        isoBox(svg, X0, Y0, u - 9, u + 7, vv[0], vv[1], -6, 0, '#D8CFC2', false, null, '', null));
      const rE = members([[-7, 5, 8, 20, 0, 58], [-7, 5, wv - 20, wv - 8, 0, 58]], g.pext, 'Pile extension', 'pext');
      multi([[-12, 12, -2, wv + 2, 58, wTop]], g.cap.concat(g.shaft, g.flare, g.head), 'Header beam');
      multi([[-5, 2, 5, 13, wTop, wBerT], [-5, 2, wv / 2 - 4, wv / 2 + 4, wTop, wBerT],
        [-5, 2, wv - 13, wv - 5, wTop, wBerT]], g.ber, 'Bearings');
      multi([[dir < 0 ? -12 : 4, dir < 0 ? -4 : 12, 0, wv, wTop, wDeckT + 2]], g.bw, 'Back wall');
      multi([[dir < 0 ? -46 : 14, dir < 0 ? -14 : 46, 4, wv - 4, wDeckT - 8, wDeckT]], g.as, 'Approach slab');
      if (rE) { const p = P(u, wv + 5, 26); halo(p[0] + 10, p[1], 'Ext ' + rE.done + '/' + rE.N + ' · ' + n2(rE.stt.pct) + '%', 8.5, 'start'); }
      if (rP) { const p = P(u, wv + 5, wPileB + 12); halo(p[0] + 10, p[1], 'Pile ' + rP.done + '/' + rP.N + ' · ' + n2(rP.stt.pct) + '%', 8.5, 'start'); }
    } else {
      const rPl = members([[-16, -6, 6, 16, wPileB, wCapB], [-16, -6, wv - 16, wv - 6, wPileB, wCapB],
        [6, 16, 6, 16, wPileB, wCapB], [6, 16, wv - 16, wv - 6, wPileB, wCapB]], g.pile, 'Pile', 'pile');
      multi([[-20, 20, -2, wv + 2, wCapB, 0]], g.cap, 'Pile cap');
      const wtShaft = wTop - (g.head.length ? hHd : 0) - (g.flare.length ? hFl : 0);
      const stS = multi([[-9, 9, wv / 2 - 10, wv / 2 + 10, 0, wtShaft]], g.shaft, 'Pier shaft');
      let stF = null;
      if (g.flare.length) {          /* tapered flare — shaft width at the bottom, spreading to the deck */
        stF = groupStatus(g.flare, ix);
        const gidF = regGroup(g.flare, B.id + ' · ' + s + ' — Pier flare');
        frustum(u, 9, 19, wv / 2 - 10, wv / 2 + 10, wv / 2 - 16, wv / 2 + 16, wtShaft, wtShaft + hFl,
          stF.empty ? ST_NOT : stF.fill, stF.hatch, gidF, s + ' — Pier flare', stF);
      }
      const stH = multi([[-13, 13, wv / 2 - 15, wv / 2 + 15, wTop - hHd, wTop]], g.head, 'Pier head');
      multi([[-5, 2, 5, 13, wTop, wBerT], [-5, 2, wv / 2 - 4, wv / 2 + 4, wTop, wBerT],
        [-5, 2, wv - 13, wv - 5, wTop, wBerT]], g.ber, 'Bearings');
      if (stS) { const p = P(u, wv / 2, wtShaft * 0.45); halo(p[0], p[1], n2(stS.pct) + '%', 9.5); }
      if (stF) { const p = P(u + 15, wv / 2 + 2, wtShaft + hFl * 0.5); halo(p[0] + 8, p[1], 'F ' + n2(stF.pct) + '%', 8, 'start'); }
      if (stH) { const p = P(u + 13, wv / 2 + 2, wTop - hHd * 0.4); halo(p[0] + 8, p[1], 'H ' + n2(stH.pct) + '%', 8, 'start'); }
      if (rPl) { const p = P(u + 16, wv + 2, wPileB + 12); halo(p[0] + 8, p[1], rPl.done + '/' + rPl.N + ' · ' + n2(rPl.stt.pct) + '%', 8.5, 'start'); }
    }
    if (g.ej.length) ejDefer.push([u, g.ej, s]);
    /* red location pin under the support, like the drawing */
    const pin = P(u, wv / 2, -62);
    sv('line', { x1: pin[0], y1: pin[1] - 9, x2: pin[0], y2: pin[1] - 15, stroke: '#D6453F', 'stroke-width': 1.2 }, svg);
    sv('circle', { cx: pin[0], cy: pin[1], r: 9, fill: '#D6453F', stroke: '#fff', 'stroke-width': 1.5 }, svg);
    sv('text', { x: pin[0], y: pin[1] + 3.2, 'text-anchor': 'middle', 'font-size': 8, 'font-weight': 700, fill: '#fff' }, svg)
      .textContent = s.replace('Abutment-0', 'A').replace('Pier-', 'P');
  }

  /* deck spans far → near — each span drawn as the BOX GIRDER it is:
     bottom slab / webs / top slab as separate parts, coloured by their own
     activities. The "Bottom Slab & Web" rebar + concrete acts are ONE
     monolithic stage-1 pour in the programme, so they drive both lower parts. */
  const DK_PARTS = [
    { k: 'bot', t: 'Bottom slab', m: /^(Bottom Slab Formwork|Bottom Slab & Web)/i },
    { k: 'web', t: 'Webs', m: /^(Web Formwork|Bottom Slab & Web|Tendon Duct)/i },
    { k: 'top', t: 'Top slab', m: /^Top Slab/i }
  ];
  for (let i = B.spans.length - 1; i >= 0; i--) {
    const pair = B.spans[i], sec = pair[0], sp = pair[1], acts = B.deck[sec + '|' + sp] || [];
    const whole = acts.length ? groupStatus(acts, ix) : null;
    const u0 = U(i), u1 = U(i + 1);
    const partBox = (pacts, t, boxes, extraClick) => {
      /* colour comes from the part's own acts; the CLICK list can carry extra
         acts (bottom slab also opens the span scaffolding + striking, so the
         first scaffolding record can be entered before the props exist) */
      const stt = pacts.length ? groupStatus(pacts, ix) : null;
      const clickActs = (pacts || []).concat(extraClick || []);
      const gid = clickActs.length ? regGroup(clickActs, B.id + ' · ' + sec + ' · ' + sp + ' — ' + t) : null;
      boxes.forEach(b2 => isoBox(svg, X0, Y0, u0, u1, b2[0], b2[1], b2[2], b2[3],
        stt && !stt.empty ? stt.fill : ST_NOT, stt ? stt.hatch : false, gid, sec + ' ' + sp + ' — ' + t, stt, b2[4]));
    };
    const byM = m => acts.filter(a => m.test(a.n));
    /* SCAFFOLDING / FALSEWORK under the span — blue props from ground to the
       soffit while scaffolding is up, gone once Formwork Striking completes.
       The bottom-slab band on top of the props is the formwork table. */
    const scOnly = acts.filter(a => /^Scaffolding/i.test(a.n));
    const strike = acts.filter(a => /^Formwork Striking/i.test(a.n));
    const scSt = scOnly.length ? groupStatus(scOnly, ix) : null;
    const stkSt = strike.length ? groupStatus(strike, ix) : null;
    if (scSt && !scSt.empty && !(stkSt && stkSt.done)) {
      const gidS = regGroup(scOnly.concat(strike), B.id + ' · ' + sec + ' · ' + sp + ' — Scaffolding / falsework (+ striking)');
      const grp = sv('g', {}, svg);
      const col = scSt.done ? '#2E6DA8' : '#4A90D9';
      const nP = Math.max(7, Math.floor(uSpan / 9));
      const uAt = k2 => u0 + 8 + (uSpan - 16) * (k2 / (nP - 1));
      /* tinted tower panel behind each row so the falsework reads as a body, not threads */
      [10, wv - 10].forEach(vv => {
        const q = [P(u0 + 8, vv, 0), P(u1 - 8, vv, 0), P(u1 - 8, vv, wBerT), P(u0 + 8, vv, wBerT)];
        const pg = sv('polygon', { points: q.map(p => p.join(',')).join(' '), fill: col, stroke: 'none' }, grp);
        pg.setAttribute('fill-opacity', 0.12);
      });
      [10, wv - 10].forEach(vv => {
        /* standards with base plates */
        for (let k2 = 0; k2 < nP; k2++) {
          const uu = uAt(k2);
          const p1 = P(uu, vv, 0), p2 = P(uu, vv, wBerT);
          sv('line', { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], stroke: col, 'stroke-width': 3.2 }, grp);
          sv('rect', { x: p1[0] - 2.8, y: p1[1] - 1.4, width: 5.6, height: 2.8, fill: col }, grp);
        }
        /* diagonal braces, alternating bay by bay */
        for (let k2 = 0; k2 < nP - 1; k2++) {
          const a = P(uAt(k2), vv, k2 % 2 ? wBerT - 4 : 4), b2 = P(uAt(k2 + 1), vv, k2 % 2 ? 4 : wBerT - 4);
          sv('line', { x1: a[0], y1: a[1], x2: b2[0], y2: b2[1], stroke: col, 'stroke-width': 1.5, 'stroke-opacity': 0.9 }, grp);
        }
        /* ledgers at three levels */
        [wBerT - 3, wBerT * 0.62, wBerT * 0.28].forEach(wl => {
          const a1 = P(u0 + 8, vv, wl), a2 = P(u1 - 8, vv, wl);
          sv('line', { x1: a1[0], y1: a1[1], x2: a2[0], y2: a2[1], stroke: col, 'stroke-width': 2 }, grp);
        });
      });
      grp.style.cursor = 'pointer';
      grp.addEventListener('click', () => structDetail(gidS));
      const tt = sv('title', {}, grp);
      tt.textContent = sec + ' ' + sp + ' — Scaffolding ' + scSt.label + ' · ' + n2(scSt.pct) + '%' +
        (stkSt ? ' · striking ' + n2(stkSt.pct) + '%' : '');
      /* FORMWORK TABLE — explicit yellow soffit table on top of the props while
         the bottom-slab formwork is up (its own clickable band, like the render) */
      const fwB = acts.filter(a => /^Bottom Slab Formwork/i.test(a.n));
      const fwSt = fwB.length ? groupStatus(fwB, ix) : null;
      if (fwSt && !fwSt.empty) {
        const gidF = regGroup(fwB, B.id + ' · ' + sec + ' · ' + sp + ' — Bottom slab formwork (table)');
        isoBox(svg, X0, Y0, u0 + 4, u1 - 4, 1, wv - 1, wBerT - 4, wBerT,
          fwSt.done ? '#D89E1B' : '#F0B429', fwSt.hatch ? 'all' : false, gidF,
          sec + ' ' + sp + ' — Formwork table (bottom slab soffit)', fwSt);
      }
      /* scaffolding tag under the span so the status is readable at a glance */
      const sl = P(u0 + uSpan / 2, wv - 10, -8);
      const st2 = sv('text', { x: sl[0], y: sl[1] + 8, 'font-size': 8.5, 'text-anchor': 'middle', 'font-weight': 700,
        fill: col, stroke: '#fff', 'stroke-width': 3, 'paint-order': 'stroke' }, svg);
      st2.textContent = 'SCAFF ' + n2(scSt.pct) + '%';
      st2.style.cursor = 'pointer';
      st2.addEventListener('click', () => structDetail(gidS));
    }
    /* every span drawn SOLID — no cutaway; the box girder anatomy (hollow
       cell + PT ducts in the webs) shows at the end cross-sections + legend */
    partBox(byM(DK_PARTS[0].m), 'Bottom slab (+ scaffolding)', [[4, wv - 4, wBerT, wBerT + 6]], scOnly.concat(strike));
    partBox(byM(DK_PARTS[1].m), 'Webs', [[6, 14, wBerT + 6, wDeckT - 6], [wv - 14, wv - 6, wBerT + 6, wDeckT - 6]]);
    partBox(byM(DK_PARTS[2].m), 'Top slab', [[-3, wv + 3, wDeckT - 6, wDeckT]]);
    /* span label — clickable, opens the WHOLE span (incl. scaffolding, curing, striking) */
    const pm = P(u0 + uSpan / 2, 0, wDeckT + 12);
    const lb = sv('text', { x: pm[0], y: pm[1], 'font-size': 9.5, 'text-anchor': 'middle',
      fill: '#5B493C', stroke: '#fff', 'stroke-width': 3, 'paint-order': 'stroke', 'font-weight': 600 }, svg);
    lb.textContent = 'S' + sp.replace('Span-0', '') + (whole ? ' · ' + n2(whole.pct) + '%' : '');
    if (acts.length) {
      const gidW = regGroup(acts, B.id + ' · ' + sec + ' · ' + sp + ' — Deck (all activities)');
      lb.style.cursor = 'pointer';
      lb.addEventListener('click', () => structDetail(gidW));
      const tt = sv('title', {}, lb);
      tt.textContent = sec + ' ' + sp + ' — whole deck span (box girder + scaffolding, ducts, curing, striking)';
    }
  }
  /* the box girder CROSS-SECTION at both exposed deck ends — trapezoid with
     sloped webs, dark hollow cell and PT duct dots, like the twin render */
  const endSection = (uu, i) => {
    const acts = B.deck[B.spans[i][0] + '|' + B.spans[i][1]] || [];
    const stOf = m => { const pa = acts.filter(a => m.test(a.n)); return pa.length ? groupStatus(pa, ix) : null; };
    const fc = s => s && !s.empty ? (s.done ? ST_DONE : s.fill) : '#E3DCD2';
    const q = (pts, fill) => sv('polygon', { points: pts.map(p => P(uu, p[0], p[1]).join(',')).join(' '),
      fill: fill, stroke: '#112528', 'stroke-width': 0.9 }, svg);
    q([[-3, wDeckT - 6], [wv + 3, wDeckT - 6], [wv - 8, wBerT], [8, wBerT]], darker(fc(stOf(DK_PARTS[1].m)), .9));   // sloped webs
    q([[8, wBerT + 6], [wv - 8, wBerT + 6], [wv - 8, wBerT], [8, wBerT]], darker(fc(stOf(DK_PARTS[0].m)), .85));    // bottom slab
    q([[-3, wDeckT], [wv + 3, wDeckT], [wv + 3, wDeckT - 6], [-3, wDeckT - 6]], darker(fc(stOf(DK_PARTS[2].m)), .85)); // top slab
    q([[13, wDeckT - 9], [wv - 13, wDeckT - 9], [wv - 17, wBerT + 8], [17, wBerT + 8]], '#22343A');                 // hollow cell
    /* PT ducts sit IN THE WEBS — two per web, none in the bottom slab */
    [[9, wBerT + 9], [wv - 9, wBerT + 9], [10, wBerT + 14], [wv - 10, wBerT + 14]].forEach(pp => {
      const c = P(uu, pp[0], pp[1]);
      sv('circle', { cx: c[0], cy: c[1], r: 1.5, fill: '#4A90D9' }, svg);
    });
  };
  endSection(0, 0); endSection(uEnd, B.spans.length - 1);
  /* section names above the spans */
  B.secOf.forEach(sec => {
    const ss = B.secSpan[sec];
    const pm = P((U(ss[0]) + U(ss[1])) / 2, 0, wDeckT + 30);
    sv('text', { x: pm[0], y: pm[1], 'text-anchor': 'middle', 'font-size': 8.5, fill: '#7A8888' }, svg).textContent = sec;
  });
  /* PT ribbons on the near deck face */
  B.secOf.forEach(sec => {
    const ss = B.secSpan[sec], acts = B.pt[sec];
    if (!acts.length) return;
    const stt = groupStatus(acts, ix), gid = regGroup(acts, B.id + ' · ' + sec + ' — Post-tensioning');
    isoBox(svg, X0, Y0, U(ss[0]) + 8, U(ss[1]) - 8, wv + 1, wv + 5, wBerT - 9, wBerT - 3,
      stt.empty ? ST_NOT : stt.fill, stt.hatch, gid, sec + ' PT', stt);
    const pl = P(U(ss[0]) + uSpan * 0.42, wv + 8, wBerT - 18);
    halo(pl[0], pl[1] + 10, 'PT ' + n2(stt.pct) + '%', 8, 'start');
  });
  /* expansion joints — a JOINT LINE marked on the deck plan (the deck stays
     continuous; the line is the joint, like a drawing convention) */
  ejDefer.forEach(e2 => {
    const u = e2[0], acts = e2[1], s = e2[2];
    const stt = groupStatus(acts, ix), gid = regGroup(acts, B.id + ' · ' + s + ' — Expansion joint');
    const p1 = P(u, -2, wDeckT), p2 = P(u, wv + 2, wDeckT);
    const grp = sv('g', {}, svg);
    /* white casing + coloured joint line on the deck surface */
    sv('line', { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], stroke: '#fff', 'stroke-width': 4.6 }, grp);
    sv('line', { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1],
      stroke: stt.empty ? '#8a8072' : (stt.done ? ST_DONE : stt.fill), 'stroke-width': 2.2,
      'stroke-dasharray': stt.done ? '' : '5 3' }, grp);
    const pl = P(u, -4, wDeckT + 7);
    sv('text', { x: pl[0], y: pl[1], 'text-anchor': 'middle', 'font-size': 7.5, 'font-weight': 700,
      fill: '#5B493C', stroke: '#fff', 'stroke-width': 2.6, 'paint-order': 'stroke' }, grp).textContent = 'EJ';
    grp.style.cursor = 'pointer';
    grp.addEventListener('click', () => structDetail(gid, s + ' EJ'));
    const t = sv('title', {}, grp);
    t.textContent = s + ' — Expansion joint · ' + stt.label + ' · ' + n2(stt.pct) + '%';
  });
}

/* ---------- drawing the underpass — PORTAL VIEW, like the VEH-UP digital-twin sheet ----------
   Looking into the box: carriageway running through, both wall cuts, top slab
   overhead, strip footings proud at the base, approach slabs on top.
   Geometry per IFC SRTA01-POL-PK01-ST-UP-DR-101001 Rev C02: 36.40 m long,
   13.0 m overall (11.0 clear + 2 × 1.1 walls), base = TWO 6.0 m strip
   footings (not a raft), 1.0 m top slab, 5.0 m approach slabs along both LONG sides of the top slab (AS-LHS / AS-RHS).
   Completed length = section % × 18.20 m, filled front→back. ---------- */
const CUL_LEN = 36.40, CUL_SEC = CUL_LEN / 2;

function darker(hex, f) {
  if (!/^#/.test(hex)) return hex;
  const n = parseInt(hex.slice(1), 16);
  const r = Math.round(((n >> 16) & 255) * f), g2 = Math.round(((n >> 8) & 255) * f), b2 = Math.round((n & 255) * f);
  return 'rgb(' + r + ',' + g2 + ',' + b2 + ')';
}

/* isometric-ish projection: u along the structure, v across, w up.
   Basis is switchable — the underpass and the bridges use different diagonals. */
let _IU = [0.92, -0.36], _IV = [0.40, 0.26];
function setIso(u, v) { _IU = u; _IV = v; }
function isoP(X0, Y0, u, v, w) { return [X0 + u * _IU[0] + v * _IV[0], Y0 + u * _IU[1] + v * _IV[1] - w]; }
function isoBox(svg, X0, Y0, u0, u1, v0, v1, w0, w1, fill, hatch, gid, title, stt, alpha) {
  const P = (u, v, w) => isoP(X0, Y0, u, v, w).join(',');
  const faces = [
    { pts: [P(u0, v0, w0), P(u1, v0, w0), P(u1, v1, w0), P(u0, v1, w0)], f: darker(fill, .8), r: 'bot' },
    { pts: [P(u1, v0, w0), P(u1, v1, w0), P(u1, v1, w1), P(u1, v0, w1)], f: darker(fill, .72), r: 'far' },
    { pts: [P(u0, v0, w0), P(u0, v1, w0), P(u0, v1, w1), P(u0, v0, w1)], f: darker(fill, .78), r: 'near' },
    { pts: [P(u0, v1, w0), P(u1, v1, w0), P(u1, v1, w1), P(u0, v1, w1)], f: darker(fill, .86), r: 'front' },
    { pts: [P(u0, v0, w1), P(u1, v0, w1), P(u1, v1, w1), P(u0, v1, w1)], f: fill, r: 'top' }
  ];
  const grp = sv('g', {}, svg);
  faces.forEach(fc => {
    const pg = sv('polygon', { points: fc.pts.join(' '), stroke: '#112528', 'stroke-width': 0.8 }, grp);
    /* hatch === true → top face only; hatch === 'all' → every viewer-facing face */
    const doH = hatch && (fc.r === 'top' || (hatch === 'all' && (fc.r === 'front' || fc.r === 'near')));
    pg.setAttribute('fill', doH ? 'url(#hz-' + colId(fill) + ')' : fc.f);
    if (alpha != null) pg.setAttribute('fill-opacity', alpha);
  });
  if (gid != null) {
    grp.style.cursor = 'pointer';
    grp.addEventListener('click', () => structDetail(gid, title));
    const t = sv('title', {}, grp);
    t.textContent = title + (stt ? ' — ' + stt.label + ' · ' + n2(stt.pct) + '%' : '');
  }
  return grp;
}

function drawUnderpass(parent, UP, ix) {
  /* shallow oblique: u = depth into the box (up-right), v = across the portal, w = up */
  setIso([0.42, -0.18], [1, 0]);
  const W = 1000, H = 470;
  const wrap = el('div', { style: 'overflow-x:auto' });
  const svg = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, width: '100%', 'class': 'upsvg', preserveAspectRatio: 'xMidYMid meet', style: 'min-width:840px;display:block' });
  wrap.appendChild(svg); parent.appendChild(wrap);
  STAGES.forEach(s => ensurePattern(svg, s.c)); ensurePattern(svg, ST_DONE);

  const kd = 8;                             // px per metre of depth
  const L = CUL_LEN * kd;                   // 291 px deep
  const wid = 360, wallT = 30, ftProj = 14; // 13.0 m portal → 360 px across
  const waH = 132, tsH = 26, ftH = 26, tsOver = 10;
  const X0 = 306, Y0 = 262;
  const Pp = (u, v, w) => isoP(X0, Y0, u, v, w);
  const poly = (pts, fill, stroke) => sv('polygon', { points: pts.map(p => p.join(',')).join(' '),
    fill: fill, stroke: stroke || '#112528', 'stroke-width': 0.9 }, svg);

  /* stage status + completed length per component */
  const comp = [
    { key: 'top',  t: 'Top slab', sub: '1.0 m thick' },
    { key: 'wall', t: 'Side walls (both)', sub: '1.1 m thick' },
    { key: 'base', t: 'Strip footings', sub: '2 × 6.0 m per IFC' }
  ];
  const st = {}, lenDone = {};
  comp.forEach(c => { st[c.key] = {}; lenDone[c.key] = 0; });
  UP.sections.forEach(sec => comp.forEach(c => {
    const acts = UP.g[sec][c.key];
    const stt = groupStatus(acts, ix);
    st[c.key][sec] = { stt: stt, gid: acts.length ? regGroup(acts, 'Underpass ' + sec + ' — ' + c.t) : null };
    /* footings: each section is ONE FULL-LENGTH strip (36.40 m), not a length half */
    if (stt) lenDone[c.key] += stt.pct / 100 * (c.key === 'base' ? CUL_LEN : CUL_SEC);
  }));

  /* ---- interior, back to front ---- */
  /* right wall inner face in shadow (gives the box its depth) */
  poly([Pp(0, wid - wallT, 0), Pp(L, wid - wallT, 0), Pp(L, wid - wallT, waH), Pp(0, wid - wallT, waH)], '#46545A', '#2B383D');
  /* light at the far portal */
  poly([Pp(L, wallT, 0), Pp(L, wid - wallT, 0), Pp(L, wid - wallT, waH), Pp(L, wallT, waH)], '#D9E6EA', '#9AB0B6');

  /* per-component geometry at a given depth range */
  function drawComp(key, ua, ub, fill, hatch, gid, title, stt) {
    const hz = hatch ? 'all' : false;
    if (key === 'base') {            // two strips at the wall bases, proud of the portal face
      const a = ua <= 0.5 ? -10 : ua;
      isoBox(svg, X0, Y0, a, ub, -ftProj, wallT + ftProj, -ftH, 0, fill, hz, gid, title, stt);
      isoBox(svg, X0, Y0, a, ub, wid - wallT - ftProj, wid + ftProj, -ftH, 0, fill, hz, gid, title, stt);
    } else if (key === 'wall') {     // left wall shows its inner face down the barrel; right wall its outer
      isoBox(svg, X0, Y0, ua, ub, 0, wallT, 0, waH, fill, hz, gid, title, stt);
      isoBox(svg, X0, Y0, ua, ub, wid - wallT, wid, 0, waH, fill, hz, gid, title, stt);
    } else {                         // top slab overhead, spanning the full width
      isoBox(svg, X0, Y0, ua, ub, -tsOver, wid + tsOver, waH, waH + tsH, fill, hz, gid, title, stt);
    }
  }

  /* footings first (floor covers their inner edges) */
  const ordered = ['base', 'wall', 'top'];
  const segsOf = key => {
    const out = [];
    for (let si = UP.sections.length - 1; si >= 0; si--) {
      const sec = UP.sections[si], S = st[key][sec];
      const u0 = si * CUL_SEC * kd, u1 = (si + 1) * CUL_SEC * kd;
      const stt = S.stt || { pct: 0, empty: true, fill: ST_NOT, hatch: false, label: 'No activities' };
      const uSplit = u0 + (u1 - u0) * Math.min(1, stt.pct / 100);
      const segs = [];
      /* the WHOLE section reads as in-progress once it has any progress:
         SOLID stage colour = completed length (front → back),
         HATCHED stage colour = the rest of that section, under work.
         Grey only when the section has nothing recorded at all. */
      if (uSplit < u1 - 0.5) segs.push({ a: uSplit, b: u1,
        fill: stt.empty ? ST_NOT : stt.fill, hatch: !stt.empty });
      if (uSplit > u0 + 0.5) segs.push({ a: u0, b: uSplit, fill: stt.done ? ST_DONE : stt.fill, hatch: false });
      if (!segs.length) segs.push({ a: u0, b: u1, fill: ST_NOT, hatch: false });
      segs.sort((x, y) => y.a - x.a);              // far part first
      segs.forEach(sg => out.push({ seg: sg, S: S, sec: sec, stt: stt }));
    }
    return out;
  };
  /* FOOTINGS (his ruling): Section-01 = ONE full-length strip, Section-02 = the
     OTHER strip — not length halves. Each strip is ONE ELEMENT: any update
     colours the WHOLE 36.40 m (stage colour, hatched running, solid done) —
     no front→back partial fill. Walls & top slab keep the length split. */
  [['Section-01', -ftProj, wallT + ftProj], ['Section-02', wid - wallT - ftProj, wid + ftProj]]
    .forEach(cfg => {
      const sec = cfg[0], S = st.base[sec];
      const stt = S.stt || { pct: 0, empty: true, fill: ST_NOT, hatch: false, label: 'No activities' };
      const fillc = stt.empty ? ST_NOT : (stt.done ? ST_DONE : stt.fill);
      isoBox(svg, X0, Y0, -10, L, cfg[1], cfg[2], -ftH, 0, fillc, stt.hatch ? 'all' : false, S.gid,
        'Underpass ' + sec + ' — Strip footing (full length, this side)', stt);
    });
  /* strip tags so there is no doubt which side is which section */
  const t1 = Pp(-16, wallT / 2 - 4, -ftH * 0.45), t2 = Pp(-16, wid - wallT / 2 - 12, -ftH * 0.45);
  [[t1, 'S1'], [t2, 'S2']].forEach(tp => sv('text', { x: tp[0][0], y: tp[0][1], 'font-size': 9.5,
    'font-weight': 700, fill: '#112528', stroke: '#fff', 'stroke-width': 3, 'paint-order': 'stroke' }, svg)
    .textContent = tp[1]);

  /* carriageway through the box */
  poly([Pp(0, wallT, 0), Pp(L, wallT, 0), Pp(L, wid - wallT, 0), Pp(0, wid - wallT, 0)], '#4C5257', '#33383C');
  for (let d = 14; d < L - 10; d += 34) {          // receding centreline dashes
    const q1 = Pp(d, wid / 2 - 3, 0.5), q2 = Pp(d + 16, wid / 2 - 3, 0.5);
    sv('line', { x1: q1[0], y1: q1[1], x2: q2[0], y2: q2[1], stroke: '#E8E8E8', 'stroke-width': 2.6 }, svg);
  }

  /* walls, then the slab overhead */
  segsOf('wall').forEach(o => drawComp('wall', o.seg.a, o.seg.b, o.seg.fill, o.seg.hatch, o.S.gid,
    'Underpass ' + o.sec + ' — Side walls', o.stt));
  segsOf('top').forEach(o => drawComp('top', o.seg.a, o.seg.b, o.seg.fill, o.seg.hatch, o.S.gid,
    'Underpass ' + o.sec + ' — Top slab', o.stt));

  /* approach slabs — the road above CROSSES the box, so its two approach
     slabs run along the LONG (36.40 m) sides of the top slab: AS-LHS / AS-RHS.
     (At the bottom slab the approach is the carriageway at the portals —
     short sides — part of the road works, no AS activities.) */
  if (UP.as.length) {
    const stt = groupStatus(UP.as, ix), gid = regGroup(UP.as, 'Underpass — Approach slabs (LHS + RHS, along the top slab long sides)');
    const fillc = stt.done ? ST_DONE : stt.fill;
    const hz = stt.hatch ? 'all' : false, asW = 40;
    isoBox(svg, X0, Y0, 6, L - 6, wid + tsOver, wid + tsOver + asW, waH + tsH, waH + tsH + 10, fillc, hz, gid, 'Approach slab (far long side) — 5.0 m wide × 36.40 m', stt);
    isoBox(svg, X0, Y0, 6, L - 6, -tsOver - asW, -tsOver, waH + tsH, waH + tsH + 10, fillc, hz, gid, 'Approach slab (near long side) — 5.0 m wide × 36.40 m', stt);
  }
  /* carriageway approach stub at the near portal (bottom, short side) — visual only */
  poly([Pp(-26, wallT + 6, 0), Pp(0, wallT, 0), Pp(0, wid - wallT, 0), Pp(-26, wid - wallT - 6, 0)], '#5A6166', '#3A4045');

  /* ---- leader labels, both sides like the sheet ---- */
  const label = (side, ly, title, sub, tp) => {
    const lx = side < 0 ? 22 : W - 22, ax = side < 0 ? lx + 132 : lx - 132;

  label(-1, 96,  'Top slab', n2(lenDone.top) + ' / ' + n2(CUL_LEN) + ' m · 1.0 m thick', Pp(6, 40, waH + tsH * 0.5));
  label(-1, 168, 'Side walls (both)', n2(lenDone.wall) + ' / ' + n2(CUL_LEN) + ' m · 1.1 m thick', Pp(2, 14, waH * 0.55));
  label(-1, 252, 'Strip footings', n2(lenDone.base) + ' / ' + n2(2 * CUL_LEN) + ' m · S1 + S2 strips', Pp(-8, 12, -ftH * 0.5));
  label(1, 96,  'Approach slabs', '5.0 m wide · both LONG sides', Pp(L * 0.55, wid + tsOver + 24, waH + tsH + 8));
  label(1, 190, 'Carriageway', 'through the box · 11.0 m clear', Pp(26, wid - wallT - 40, 1));

  /* chainage ticks along the top-right receding edge */
  [0, CUL_SEC, CUL_LEN].forEach(mv => {
    const p1 = Pp(mv * kd, wid + tsOver, waH + tsH), p2 = [p1[0] + 6, p1[1] - 12];
    sv('line', { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], stroke: '#8a8072', 'stroke-width': 1 }, svg);
    sv('text', { x: p2[0] + 2, y: p2[1] - 2, 'font-size': 9.5, fill: '#7A8888' }, svg).textContent = n2(mv) + ' m';
  });
  UP.sections.forEach((sec, si) => {
    const p = Pp((si + 0.5) * CUL_SEC * kd, wid * 0.52, waH + tsH + 2);
    sv('text', { x: p[0], y: p[1], 'text-anchor': 'middle', 'font-size': 10.5, 'font-weight': 700,
      fill: '#5B493C', stroke: '#fff', 'stroke-width': 3, 'paint-order': 'stroke' }, svg).textContent = sec;
  });

  /* ---- true cross-section inset (bottom-left) ---- */
  (function crossSection() {
    const sx = 12, x0 = 44, yb = 448;
    const wOv = 13.0 * sx, wall = 1.1 * sx, ftW = 6.0 * sx, ftHs = 14, waHs = 52, tsHs = 14;
    const yFt = yb - ftHs, yWa = yFt - waHs, yTs = yWa - tsHs;

      .textContent = 'CROSS-SECTION (WHOLE STRUCTURE)';
    const agg = key => UP.g['Section-01'][key].concat(UP.g['Section-02'][key]);
    const paintSec = (node, acts, label2) => {
      if (!acts.length) { node.setAttribute('fill', ST_NOT); node.setAttribute('stroke', ST_NOT_BORD); return; }
      const stt = groupStatus(acts, ix), gid = regGroup(acts, 'Underpass — ' + label2 + ' (both sections)');
      paintEl(node, stt, gid, label2);
    };
    const wa = agg('wall'), tp = agg('top');
    /* footings per SIDE — left = Section-01 strip, right = Section-02 strip */
    paintSec(sv('rect', { x: x0 - 12, y: yFt, width: ftW, height: ftHs }, svg),
      UP.g['Section-01'].base, 'Strip footing S1 (one side, full length)');
    paintSec(sv('rect', { x: x0 + wOv + 12 - ftW, y: yFt, width: ftW, height: ftHs }, svg),
      UP.g['Section-02'].base, 'Strip footing S2 (other side, full length)');
    paintSec(sv('rect', { x: x0, y: yWa, width: wall, height: waHs }, svg), wa, 'Side walls (both)');
    paintSec(sv('rect', { x: x0 + wOv - wall, y: yWa, width: wall, height: waHs }, svg), wa, 'Side walls (both)');
    paintSec(sv('rect', { x: x0 - 5, y: yTs, width: wOv + 10, height: tsHs }, svg), tp, 'Top slab');
    /* approach slabs flank the top slab on the LONG sides — visible in this cross-section */
    paintSec(sv('rect', { x: x0 - 5 - 17, y: yTs, width: 15, height: tsHs }, svg), UP.as, 'Approach slab (LHS, along the long side)');
    paintSec(sv('rect', { x: x0 + wOv + 7, y: yTs, width: 15, height: tsHs }, svg), UP.as, 'Approach slab (RHS, along the long side)');
    sv('text', { x: x0 + wOv / 2, y: yb + 12, 'text-anchor': 'middle', 'font-size': 8.5, fill: '#7A8888' }, svg)
      .textContent = '13.0 m overall · 11.0 m clear';
  })();

  /* fill + finishing as clickable chips */
  const chips = el('div', { class: 'row', style: 'gap:8px;margin-top:6px;flex-wrap:wrap' });
  const chipFor = (acts, label2) => {
    if (!acts.length) return;
    const stt = groupStatus(acts, ix), gid = regGroup(acts, 'Underpass — ' + label2);
    chips.appendChild(el('span', {
      class: 'tag', style: 'cursor:pointer;border-left:10px solid ' + (stt.done ? ST_DONE : stt.fill),
      onclick: () => structDetail(gid)
    }, label2 + ' · ' + n2(stt.pct) + '%'));
  };
  chipFor(UP.as, 'Approach slabs (both long sides)'); chipFor(UP.fill, 'Fill above top slab'); chipFor(UP.fin, 'Finishing works');
  parent.appendChild(chips);

  /* length table — the "how much length completed" answer in numbers */
  const rows = comp.map(c => {
    const s1 = st[c.key]['Section-01'].stt, s2 = st[c.key]['Section-02'].stt;
    const tot = c.key === 'base' ? 2 * CUL_LEN : CUL_LEN;   // footings = two full-length strips
    return [c.key === 'base' ? c.t + ' (S1 strip + S2 strip)' : c.t,
      { v: s1 ? n2(s1.pct) : '—', n: 1 }, { v: s2 ? n2(s2.pct) : '—', n: 1 },
      { v: n2(lenDone[c.key]), n: 1 }, { v: n2(tot - lenDone[c.key]), n: 1 },
      { v: n2(lenDone[c.key] / tot * 100) + '%', n: 1 }];
  });
  parent.appendChild(el('div', { style: 'margin-top:8px' },
    table(['Component', { t: 'Section-01 %', n: 1 }, { t: 'Section-02 %', n: 1 },
      { t: 'Length complete (m)', n: 1 }, { t: 'Remaining (m)', n: 1 }, { t: 'Overall', n: 1 }], rows)));
  parent.appendChild(el('div', { class: 'housenote' }, [el('span', { class: 'k' }, 'Underpass — how to read'),
    'Portal view — looking into the box with the carriageway running through, like the VEH-UP progress sheet. ' +
    'FOOTINGS: Section-01 = one full-length 36.40 m strip (tagged S1, far side in the view), Section-02 = the ' +
    'other strip (S2, near side) — each strip recolours over its FULL length as one element (hatched = running, ' +
    'solid = done). WALLS and TOP SLAB: once a section has ANY progress the WHOLE 18.20 m section reads as ' +
    'in-progress — SOLID stage colour fills front→back by the completed length (section % × 18.20 m) and the ' +
    'REST of that section shows HATCHED in the same stage colour; grey only where nothing is recorded ' +
    '(Section-01 is the near half). Geometry per IFC SRTA01-POL-PK01-ST-UP-DR-101001 ' +
    'Rev C02: 36.40 m long × 13.0 m overall, two 6.0 m strip footings, 1.0 m top slab, 5.0 m approach slabs ' +
    'along both LONG sides of the top slab (AS-LHS / AS-RHS — the road above crosses the box); at the bottom slab ' +
    'the approach is the carriageway at the portals (short sides). Tap any part to enter progress.']));
}

/* ---------- summary counts (like the weekly slide chips) ---------- */
function bridgeCounts(B, ix) {
  const done = arr => arr.filter(g => g && g.length && groupStatus(g, ix).done).length;
  const piers = B.supports.filter(s => /^Pier/.test(s));
  const pierCol = s => B.supp[s].shaft.concat(B.supp[s].flare, B.supp[s].head);
  const capsT = piers.filter(s => B.supp[s].cap.length).length;
  const colsT = piers.filter(s => pierCol(s).length).length;
  const spansT = B.spans.filter(([sec, sp]) => (B.deck[sec + '|' + sp] || []).length).length;
  /* piles by quantity (nr) */
  let pQ = 0, pA = 0;
  B.supports.forEach(s => B.supp[s].pile.forEach(a => {
    if (/^Piling/i.test(a.disc || '') || /^Piling/i.test(a.n)) {
      if (a.q) { pQ += a.q; pA += Math.min(a.q, (ix[a.i] ? ix[a.i].a : 0) / 100 * a.q); }
    }
  }));
  return [
    { t: 'Piles cast', a: nf(pA, 0), b: nf(pQ, 0) },
    { t: 'Pile caps complete', a: done(piers.map(s => B.supp[s].cap)), b: capsT },
    { t: 'Piers complete', a: done(piers.map(pierCol)), b: colsT },
    { t: 'Deck spans complete', a: done(B.spans.map(([sec, sp]) => B.deck[sec + '|' + sp])), b: spansT },
    { t: 'PT sections stressed', a: done(B.secOf.map(sec => B.pt[sec])), b: B.secOf.filter(sec => B.pt[sec].length).length }
  ];
}

/* ---------- element-count table + graph, like his Progress — Bridges slide ---------- */
function bridgeStats(B, ix) {
  const piers = B.supports.filter(s => /^Pier/.test(s));
  const abuts = B.supports.filter(s => /^Abutment/.test(s));
  const doneU = list => list.filter(g => g && g.length && groupStatus(g, ix).done).length;
  const sub = (g, re) => (g || []).filter(a => re.test(a.n) || re.test(a.disc || ''));
  const cnt = (units, getter, re) => {
    let t = 0, a2 = 0;
    units.forEach(u => { const g = sub(getter(u), re); if (!g.length) return; t++; if (groupStatus(g, ix).done) a2++; });
    return { t: t, a: a2 };
  };
  let pQ = 0, pA = 0;
  B.supports.forEach(s => B.supp[s].pile.forEach(a => {
    if (/^Piling/i.test(a.disc || '') || /^Piling/i.test(a.n))
      if (a.q) { pQ += a.q; pA += Math.min(a.q, (ix[a.i] ? ix[a.i].a : 0) / 100 * a.q); }
  }));
  let eT = 0, eA = 0;
  abuts.forEach(s => { const g = B.supp[s].pext; if (!g.length) return; eT += 2;
    eA += Math.floor(groupStatus(g, ix).pct / 100 * 2 + 1e-6); });          // floor — never overstated
  const rows = [];
  rows.push({ t: 'Piling Works', tot: Math.round(pQ), act: Math.floor(pA + 1e-6) });
  if (eT) rows.push({ t: 'Piles Extension', tot: eT, act: eA });
  const cRe = cnt(piers, s => B.supp[s].cap, /reinforcement/i);
  if (cRe.t) rows.push({ t: 'Pile-Caps Reinforcement', tot: cRe.t, act: cRe.a });
  const cCo = cnt(piers, s => B.supp[s].cap, /concrete/i);
  if (cCo.t) rows.push({ t: 'Pile-Caps Casting', tot: cCo.t, act: cCo.a });
  const pRe = cnt(piers, s => B.supp[s].shaft.concat(B.supp[s].flare, B.supp[s].head), /reinforcement/i);
  if (pRe.t) rows.push({ t: 'Piers Reinforcement', tot: pRe.t, act: pRe.a });
  const sCo = cnt(piers, s => B.supp[s].shaft, /concrete/i);
  if (sCo.t) rows.push({ t: 'Pier Shaft Casting', tot: sCo.t, act: sCo.a });
  const fCo = cnt(piers, s => B.supp[s].flare.concat(B.supp[s].head), /concrete/i);
  if (fCo.t) rows.push({ t: 'Pier Flare / Head Casting', tot: fCo.t, act: fCo.a });
  rows.push({ t: 'Deck Spans Complete',
    tot: B.spans.filter(([sec, sp]) => (B.deck[sec + '|' + sp] || []).length).length,
    act: doneU(B.spans.map(([sec, sp]) => B.deck[sec + '|' + sp])) });
  const ptT = B.secOf.filter(sec => B.pt[sec].length).length;
  if (ptT) rows.push({ t: 'PT Sections Stressed', tot: ptT, act: doneU(B.secOf.map(sec => B.pt[sec])) });
  return rows;
}

    ]));

function statTable(rows, B, compact) {

function statChart(rows, compact) {
  const pctOf = r => r.tot ? r.act / r.tot * 100 : 0;
  const rowH = compact ? 22 : 24, chW = compact ? 470 : 560, x0 = compact ? 158 : 170, fs = compact ? 10 : 8.5;
  const x1 = chW - 14, span = x1 - x0;

  [0, 25, 50, 75, 100].forEach(t => {

    sv('line', { x1: x, y1: 5, x2: x, y2: chH - 16, stroke: '#EFE9E2', 'stroke-width': 1 }, svgc);
    sv('text', { x: x, y: chH - 5, 'font-size': fs - 0.5, fill: '#7A8888', 'text-anchor': 'middle' }, svgc).textContent = t + '%';
  });
  rows.forEach((r, i) => {

    const pl = Math.round(p) + '%';

    else sv('text', { x: x0 + aw + 5, y: y + bh - 3, 'font-size': fs, 'font-weight': 700, fill: '#D2600F' }, svgc).textContent = pl;
    if (p < 99.5 && span - aw > 38)

  });
  return svgc;

function statBlock(parent0, B, ix) {

/* ---------- the view ---------- */
/* ============================================================
   ALL-BRIDGES-IN-ONE SHEET — flat elevation per bridge in the
   style of the Rev.01 structural presentation sheet, but with
   every element coloured by its LIVE work stage (clickable).
   ============================================================ */
function drawBridgeElev(parent, B, ix) {
  const W = 1160, H = 292, mx = 48;
  const wrap = el('div', { style: 'overflow-x:auto' });
  const svg = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, width: '100%', style: 'min-width:900px;display:block' });
  wrap.appendChild(svg); parent.appendChild(wrap);
  STAGES.forEach(s => ensurePattern(svg, s.c)); ensurePattern(svg, ST_DONE);
  const nS = B.supports.length;
  const X = i => mx + i * (W - 2 * mx) / (nS - 1);
  const dY = 66, dH = 22, yGL = dY + 110, yPileB = yGL + 44;
  const box = (x, y, w2, h2, acts, label, dash) => {
    const stt = acts && acts.length ? groupStatus(acts, ix) : null;
    const r = sv('rect', { x: x, y: y, width: w2, height: h2 }, svg);
    if (dash) r.setAttribute('stroke-dasharray', '4 3');
    paintEl(r, stt, acts && acts.length ? regGroup(acts, label) : null, label);
    return stt;
  };
  const polyE = (pts, acts, label) => {
    const stt = acts && acts.length ? groupStatus(acts, ix) : null;
    const pg = sv('polygon', { points: pts.map(p => p.join(',')).join(' ') }, svg);
    paintEl(pg, stt, acts && acts.length ? regGroup(acts, label) : null, label);
    return stt;
  };
  /* GL line */
  sv('line', { x1: mx - 26, y1: yGL, x2: W - mx + 26, y2: yGL, stroke: '#8a8072', 'stroke-width': 1, 'stroke-dasharray': '6 4' }, svg);
  sv('text', { x: mx - 30, y: yGL + 3.5, 'font-size': 8, fill: '#7A8888', 'text-anchor': 'end' }, svg).textContent = 'GL';
  /* deck spans */
  B.spans.forEach((pair, i) => {
    const sec = pair[0], sp = pair[1], acts = B.deck[sec + '|' + sp] || [];
    const x0 = X(i) + 3, x1 = X(i + 1) - 3;
    box(x0, dY, x1 - x0, dH, acts, B.id + ' · ' + sec + ' · ' + sp + ' — Deck (all activities)');
    const stt = acts.length ? groupStatus(acts, ix) : null;
    sv('text', { x: (x0 + x1) / 2, y: dY - 8, 'font-size': 9.5, 'text-anchor': 'middle', fill: '#5B493C',
      'font-weight': 600, stroke: '#fff', 'stroke-width': 3, 'paint-order': 'stroke' }, svg)
      .textContent = 'S' + sp.replace('Span-0', '') + (stt ? ' · ' + n2(stt.pct) + '%' : '');
    /* scaffolding still up under this span → blue falsework lines */
    const sc = acts.filter(a => /^Scaffolding/i.test(a.n)), stk = acts.filter(a => /^Formwork Striking/i.test(a.n));
    const scSt = sc.length ? groupStatus(sc, ix) : null, stkSt = stk.length ? groupStatus(stk, ix) : null;
    if (scSt && !scSt.empty && !(stkSt && stkSt.done)) {
      const colS = scSt.done ? '#2E6DA8' : '#4A90D9';
      const gidS = regGroup(sc.concat(stk), B.id + ' · ' + sec + ' · ' + sp + ' — Scaffolding / falsework (+ striking)');
      const gsc = sv('g', {}, svg);
      const nL = Math.max(5, Math.floor((x1 - x0) / 10));
      for (let k = 0; k < nL; k++) {
        const xx = x0 + 5 + (x1 - x0 - 10) * (k / (nL - 1));
        sv('line', { x1: xx, y1: dY + dH, x2: xx, y2: yGL, stroke: colS, 'stroke-width': 2.4 }, gsc);
      }
      [dY + dH + 8, (dY + dH + yGL) / 2, yGL - 8].forEach(yy =>
        sv('line', { x1: x0 + 5, y1: yy, x2: x1 - 5, y2: yy, stroke: colS, 'stroke-width': 1.4 }, gsc));
      gsc.style.cursor = 'pointer';
      gsc.addEventListener('click', () => structDetail(gidS));
      sv('title', {}, gsc).textContent = sec + ' ' + sp + ' — Scaffolding ' + n2(scSt.pct) + '%';
    }
  });
  /* section names above */
  B.secOf.forEach(sec => {
    const ss = B.secSpan[sec];
    sv('text', { x: (X(ss[0]) + X(ss[1])) / 2, y: dY - 24, 'font-size': 8.5, fill: '#7A8888', 'text-anchor': 'middle' }, svg)
      .textContent = sec;
  });
  /* supports */
  B.supports.forEach((s, i) => {
    const g = B.supp[s], x = X(i), isAb = /^Abutment/.test(s);
    const nm = isAb ? 'A' + s.replace('Abutment-0', '') : 'P' + s.replace('Pier-', '');
    if (g.ber.length) box(x - 7, dY + dH + 0.5, 14, 4, g.ber, B.id + ' · ' + s + ' — Bearings');
    if (isAb) {
      box(x - 18, dY + dH + 5, 36, 12, g.cap, B.id + ' · ' + s + ' — Header beam');            // header beam
      [-9, 9].forEach((o, k) => box(x + o - 3, dY + dH + 17, 6, yGL - (dY + dH + 17), g.pext,
        B.id + ' · ' + s + ' — Pile extensions (' + (k + 1) + ')', true));                      // extensions, dashed
      [-9, 9].forEach((o, k) => box(x + o - 3.5, yGL, 7, 44, g.pile, B.id + ' · ' + s + ' — Piles'));
    } else {
      const hasHead = g.head.length > 0;
      let yTop = dY + dH + 5;
      if (hasHead) { box(x - 24, yTop, 48, 11, g.head, B.id + ' · ' + s + ' — Pier head'); yTop += 11; }
      polyE([[x - 20, yTop], [x + 20, yTop], [x + 8, yTop + 28], [x - 8, yTop + 28]],
        g.flare.length ? g.flare : g.shaft, B.id + ' · ' + s + ' — Pier flare');                // flare (tapered)
      box(x - 8, yTop + 28, 16, (dY + dH + 96) - (yTop + 28), g.shaft, B.id + ' · ' + s + ' — Pier shaft');

      [-16, -5.5, 5, 15.5].forEach(o => box(x + o - 3, yGL, 6.5, 44, g.pile, B.id + ' · ' + s + ' — Piles'));
    }
    /* EJ mark */
    if (g.ej.length) {
      const stt = groupStatus(g.ej, ix), gid = regGroup(g.ej, B.id + ' · ' + s + ' — Expansion joint');
      const ln = sv('line', { x1: x, y1: dY - 3, x2: x, y2: dY + dH + 3, stroke: stt.done ? ST_DONE : '#D32F2F',
        'stroke-width': 3 }, svg);

    /* red pin + support % */
    const allG = [].concat(g.pile, g.pext, g.cap, g.shaft, g.flare, g.head, g.ber, g.bw, g.as, g.ej);
    const sttAll = allG.length ? groupStatus(allG, ix) : null;
    sv('circle', { cx: x, cy: yPileB + 12, r: 8, fill: '#D32F2F' }, svg);

      'font-weight': 600, stroke: '#fff', 'stroke-width': 3, 'paint-order': 'stroke' }, svg)
      .textContent = n2(sttAll.pct) + '%';
  });
  /* PT layout bar per section, like the sheet */
  B.secOf.forEach((sec, si) => {

      .textContent = 'PT SECTION ' + (si + 1) + (stt ? ' · ' + n2(stt.pct) + '%' : '');
  });
}

/* ============================================================
   37 — ROADS & SERVICES strip-map (Option A / his call "option c")
   ------------------------------------------------------------
   Same engine as Structures, but built purely from the XER codes:
   · ROAD WORKS — each road is a strip of horizontal LAYER BANDS in
     the house band order (wearing at the top … formation at the
     bottom), split Carriageway / Parking / Footpath / Furniture.
   · SERVICES  — one lane per pipe/cable RUN, grouped by service and
     zone, coloured by its own stage cycle (excavation → laying →
     chambers → backfilling → testing → connection).
   Band fill = Rev 6.1 semantics: SOLID stage colour from the left =
   % done, HATCHED same colour = rest while running, grey = untouched.
   Slate ▼ tick on every band = PLANNED EARLY % at the cut-off.
   Segmenting is by ZONE (the XER coding) — side-wise LHS/C-M/RHS
   needs new activity codes at the next revision (flagged, his call).
   ============================================================ */

const RD_STAGES = [
  { t: 'Formation', c: '#B5905E', m: /^formation/i },
  { t: 'Sub-base', c: '#C9B08A', m: /sub-?base/i },

  { t: 'Tack coat', c: '#7A6A5A', m: /tack/i },
  { t: 'Wearing course', c: '#2B2E3C', m: /wearing/i },

/* ---------- one progress band row ----------
   Rev 6.1 fill semantics + slate planned tick. Whole row clickable. */
function bandRow(parent, label, sub, acts, ix, px, opts) {
  opts = opts || {};
  const stt = groupStatus(acts, ix, opts.stageFn, opts.stageList);
  let cw = 0, cs = 0;
  acts.forEach(a => { const w = a.c > 0 ? a.c : 1; cw += w; cs += w * (px[a.i] ? px[a.i].a : 0); });
  const plan = cw ? cs / cw : 0;
  const pct = stt ? stt.pct : 0;
  const gid = acts.length ? regGroup(acts, (opts.gtitle || label)) : null;

  const row = el('div', { class: 'rdrow' });
  const lab = el('div', { class: 'rdlab' }, [
    el('b', {}, label), sub ? el('span', {}, sub) : null].filter(Boolean));
  row.appendChild(lab);

  const W = 1000, H = 22;
  const svg = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'none', class: 'rdsvg' });
  if (stt && !stt.empty) ensurePattern(svg, stt.done ? ST_DONE : stt.fill);
  sv('rect', { x: 0, y: 0, width: W, height: H, fill: '#F2EEE8', stroke: '#DCCEC2', 'stroke-width': 1 }, svg);
  if (stt && !stt.empty) {
    const wDone = W * Math.min(1, pct / 100);
    const col = stt.done ? ST_DONE : stt.fill;
    if (wDone > 2) sv('rect', { x: 0, y: 0, width: wDone, height: H, fill: col }, svg);
    if (!stt.done && wDone < W - 2)
      sv('rect', { x: wDone, y: 0, width: W - wDone, height: H, fill: 'url(#hz-' + colId(col) + ')' }, svg);
  }
  /* planned-early tick (slate) */
  const xp = W * Math.min(1, plan / 100);
  sv('line', { x1: xp, y1: 0, x2: xp, y2: H, stroke: '#355056', 'stroke-width': 2.5, 'stroke-dasharray': '3 2' }, svg);
  sv('path', { d: 'M' + (xp - 5) + ',0 L' + (xp + 5) + ',0 L' + xp + ',7 Z', fill: '#355056' }, svg);
  const tt = sv('title', {}, svg);
  tt.textContent = (opts.gtitle || label) + ' — ' + (stt ? stt.label : 'No activities') +
    ' · actual ' + n2(pct) + '% · planned early ' + n2(plan) + '%';
  row.appendChild(svg);

  const behind = pct - plan < -0.005;
  row.appendChild(el('div', { class: 'rdpct' }, [
    el('b', { style: behind ? 'color:#FF0000' : '' }, n2(pct) + '%'),
    el('span', {}, 'P ' + n2(plan) + '%')
  ]));
  if (gid) { row.style.cursor = 'pointer'; row.addEventListener('click', () => structDetail(gid, opts.gtitle || label)); }
  parent.appendChild(row);
  return { pct: pct, plan: plan };
}

/* ---------- models ---------- */
function roadsModel() {
  const R = {};
  ST.BL.acts.forEach(a => {
    if (a.i.indexOf('CON-') !== 0 || !a.roadCode) return;
    const r = R[a.roadCode] = R[a.roadCode] || { code: a.roadCode, name: a.road, zone: a.zone || '', acts: [] };
    if (a.zone && !r.zone) r.zone = a.zone;
    r.acts.push(a);
  });
  return Object.keys(R).sort().map(k => R[k]);
}
function svcModel() {
  const out = [];
  SVC_PARTS.forEach(p => {
    const acts = ST.BL.acts.filter(a => a.i.indexOf('CON-') === 0 && a.boq === p.b);
    if (!acts.length) return;
    /* run = ID minus the trailing -NNNN counter, within a zone */
    const runs = {};
    acts.forEach(a => {
      const key = (a.zone || 'General') + '|' + a.i.replace(/-\d+$/, '');
      (runs[key] = runs[key] || { zone: a.zone || 'General', key: a.i.replace(/-\d+$/, ''), acts: [] }).acts.push(a);
    });
    const list = Object.values(runs).sort((x, y) => x.zone < y.zone ? -1 : x.zone > y.zone ? 1 : (x.key < y.key ? -1 : 1));
    out.push({ part: p, runs: list, acts: acts });
  });
  return out;
}
/* run label: the longest common name prefix of its activities, cleaned */
function runLabel(run) {
  let pre = run.acts[0].n;
  run.acts.forEach(a => { let i = 0; while (i < pre.length && i < a.n.length && pre[i] === a.n[i]) i++; pre = pre.slice(0, i); });
  pre = pre.replace(/[-–—( ]+$/, '').trim();
  if (pre.length < 6) pre = run.key.replace('CON-', '');
  const q = run.acts.reduce((m, a) => (a.u === 'm' && a.q > (m.q || 0)) ? { q: a.q, u: a.u } : m, {});
  return { t: pre, q: q.q ? nf(q.q, 0) + ' m' : run.acts.length + ' act' + (run.acts.length > 1 ? 's' : '') };
}

/* small cost-weighted rollup for a pool (actual + planned early) */
function rollup2(acts, ix, px) {
  let cw = 0, ca = 0, cp = 0;
  acts.forEach(a => { const w = a.c > 0 ? a.c : 1; cw += w;
    ca += w * (ix[a.i] ? ix[a.i].a : 0); cp += w * (px[a.i] ? px[a.i].a : 0); });
  return { ac: cw ? ca / cw : 0, pe: cw ? cp / cw : 0 };
}

/* twin-grouped w.r.t Item / w.r.t Project table (§22) */
function wrtTable(rows, labelHead, filtered) {
  const T = rows.length && rows[0].subTotal ? rows[0].subTotal : ST.BL.TOT;
  const cnt = rows.length && rows[0].basis === 'count';
  const body = rows.map(b => ({
    cells: [ragDot(b.itemVar) + esc(b.label), { v: nf(b.cost, 0), n: 1 }, { v: n2(b.w8), n: 1 },
      { v: n2(b.itemPlanE), n: 1 }, { v: n2(b.itemAct), n: 1 },
      { v: n2(b.projPlanE), n: 1 }, { v: n2(b.projAct), n: 1 }, negTd(b.projVar),
      { v: n2(b.spi), n: 1, cls: b.spi < 1 ? 'neg' : '' }]
  }));
  const tc = rows.reduce((s, b) => s + b.cost, 0);
  const tpe = rows.reduce((s, b) => s + b.projPlanE, 0), tac = rows.reduce((s, b) => s + b.projAct, 0);
  body.push({
    cls: 'tot', cells: ['TOTAL', { v: nf(tc, 0), n: 1 }, { v: n2(tc / T * 100), n: 1 }, { v: '', n: 1 }, { v: '', n: 1 },
      { v: n2(tpe), n: 1 }, { v: n2(tac), n: 1 }, negTd(tac - tpe), { v: n2(tpe ? tac / tpe : 0), n: 1 }]
  });
  return table(
    [labelHead || 'Item', { t: 'Budgeted cost AED', n: 1 }, { t: (cnt ? 'Activity wtg %' : 'Cost wtg %'), n: 1 },
      { t: 'Planned %', n: 1, c: 'o' }, { t: 'Actual %', n: 1, c: 'o' },
      { t: 'Planned %', n: 1 }, { t: 'Actual %', n: 1 }, { t: 'Variance %', n: 1 }, { t: 'SPI', n: 1 }],
    body,
    { groupHead: [['', 3], ['With respect to Item', 2],
      ['With respect to ' + (filtered ? 'Selection' : 'Project'), 3], ['', 1]], scroll: 1 });
}

function fieldProductivity(from, to) {
  const byAct = {};
  DB.all('progress').forEach(p => {
    if (p.mode !== 'qty' || !p.qty) return;
    if (from && p.date < from) return; if (to && p.date > to) return;
    const a = ST.BL.byId[p.actId]; if (!a || !a.rate) return;
    const o = byAct[p.actId] = byAct[p.actId] || { a: a, qty: 0, days: {} };
    o.qty += +p.qty; o.days[p.date] = 1;
  });
  return Object.values(byAct).map(o => {
    const d = Object.keys(o.days).length;
    const act = d ? o.qty / d : 0;
    return { a: o.a, plan: o.a.rate, act: act, days: d, qty: o.qty, eff: o.a.rate ? act / o.a.rate : 0 };
  }).sort((x, y) => x.eff - y.eff);
}

/* ---------------- SYNC ---------------- */
const SYNC = {
  base: '', timer: null, busy: false,
  init() {
    const o = location.origin;
    this.base = (location.protocol === 'http:' || location.protocol === 'https:') ? o : (DB.getMeta('serverUrl', '') || '');
    window.addEventListener('online', () => this.now());
    setInterval(() => this.now(), 120000);
    this.now();
  },
  schedule() { clearTimeout(this.timer); this.timer = setTimeout(() => this.now(), 2500); renderTop(); },
  async ping() {
    if (!this.base) { ST.online = false; return false; }
    try {
      const r = await fetch(this.base + '/api/ping', { cache: 'no-store' });
      ST.online = r.ok; return r.ok;
    } catch (e) { ST.online = false; return false; }
  },
  async now(manual) {
    if (this.busy) return;
    this.busy = true;
    try {
      if (!(await this.ping())) { if (manual) toast('No server on this network — data is safe on this device and will sync later.'); return; }
      /* push */
      const q = Object.values(DB.mem.outbox || {});
      if (q.length) {
        const recs = q.map(o => ({ store: o.store, rec: DB.mem[o.store][o.ref] })).filter(x => x.rec);
        const r = await fetch(this.base + '/api/push', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device: ST.deviceId, user: ST.user && ST.user.id, recs: recs })
        });
        if (r.ok) DB.clearQueue(q.map(o => o.id));
      }
      /* pull */
      const since = DB.getMeta('pullRev', 0);
      const p = await fetch(this.base + '/api/pull?since=' + since);
      if (p.ok) {
        const j = await p.json();
        let max = since;
        (j.recs || []).forEach(x => {
          const cur = DB.mem[x.store] && DB.mem[x.store][x.rec.id];
          if (!cur || (x.rec.rev || 0) >= (cur.rev || 0)) {
            if (DB.mem[x.store]) DB.put(x.store, x.rec, true);
          }
          if ((x.rec.rev || 0) > max) max = x.rec.rev;
        });
        if (j.users) DB.setMeta('users', j.users);
        DB.setMeta('pullRev', max);
        if (manual) toast('Synced — ' + (j.recs || []).length + ' record(s) in');
      }
      /* baseline distribution: push a locally-imported baseline that has not
         reached the server yet, then adopt the server's if it is different */
      await this.pushBaseline();
      await this.checkBaseline();
    } catch (e) { console.warn('sync', e); if (manual) toast('Sync failed: ' + e.message, true); }
    finally { this.busy = false; renderTop(); if (manual) render(); }
  },
  async pushBaseline() {
    const ov = DB.getMeta('blOverride', null);
    if (!ov || ov.pushed || !this.base || !ST.online) return;
    try {
      const r = await fetch(this.base + '/api/baseline', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ver: ov.ver, basis: ov.basis, label: ov.label, at: ov.at, by: ov.by,
          b64: ov.b64 || null, raw: ov.raw || null })
      });
      if (r.ok) { ov.pushed = true; DB.setMeta('blOverride', ov); toast('Imported baseline pushed to the server — all devices will adopt it'); }
    } catch (e) { console.warn('pushBaseline', e); }
  },
  async checkBaseline() {
    if (!this.base || !ST.online) return;
    try {
      const cur = DB.getMeta('blOverride', null);
      const r = await fetch(this.base + '/api/baseline?ver=' + encodeURIComponent(cur ? cur.ver : ''), { cache: 'no-store' });
      if (!r.ok) return;
      const j = await r.json();
      if (!j.ver || j.same) return;                              // server has none / same as ours
      if (cur && cur.ver === j.ver) return;
      if (cur && !cur.pushed && cur.ver > j.ver) return;         // ours is newer and still queued to push
      DB.setMeta('blOverride', { ver: j.ver, basis: j.basis, label: j.label, at: j.at, by: j.by,
        b64: j.b64 || null, raw: j.raw || null, pushed: true });
      await reloadBaselineInPlace();
      toast('New baseline adopted from the server: ' + (j.label || j.ver));
    } catch (e) { console.warn('checkBaseline', e); }
  }
};
