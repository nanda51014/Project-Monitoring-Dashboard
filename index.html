<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#112528">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>R2200 SiteTrack — M-523</title>
<style>/* ===== R2200 SiteTrack — house palette (§22) ===== */
:root{
  --dark:#112528; --dark2:#203A3E; --slate:#355056;
  --org:#EF6925; --org2:#D2600F; --coral:#FF724B;
  --cream:#EBE3DC; --tan:#DCCEC2; --pale:#EAF2F4;
  --body:#5B493C; --mut:#7A8888; --neg:#FF0000;
  --grn:#1E8F5A; --amb:#E0A800; --red:#C62828;
  --card:#fff; --rad:10px;
  --sh:0 1px 3px rgba(17,37,40,.10), 0 4px 14px rgba(17,37,40,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{margin:0;padding:0}
body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:var(--cream);color:var(--dark);overscroll-behavior-y:contain}
h1,h2,h3,h4{margin:0;font-weight:700;color:var(--dark)}
a{color:var(--org2)}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}

/* ---------- top banner ---------- */
#top{position:sticky;top:0;z-index:60;background:var(--dark);color:#fff;
  border-bottom:3px solid var(--org)}
#topin{display:flex;align-items:center;gap:10px;padding:8px 12px;max-width:1500px;margin:0 auto}
#logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--org),var(--org2));
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;flex:0 0 auto}
#ttl{font-weight:700;font-size:15px;letter-spacing:.2px;line-height:1.15}
#sub{font-size:11px;color:#9fb3b6}
#topsp{flex:1}
.pill{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.pill.on{background:#1E8F5A;color:#fff}.pill.off{background:#7A8888;color:#fff}
.pill.q{background:var(--org);color:#fff}
#who{font-size:11px;color:#cfe0e2;text-align:right;line-height:1.25;cursor:pointer}
#who b{display:block;color:#fff;font-size:12px}

/* ---------- nav ---------- */
#nav{background:var(--dark2);position:sticky;top:52px;z-index:55;overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#navin{display:flex;gap:2px;padding:0 8px;max-width:1500px;margin:0 auto}
.nb{background:none;border:0;color:#9fb3b6;padding:11px 13px;font-size:12.5px;font-weight:600;
  white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent}
.nb:hover{color:#fff}
.nb.act{color:#fff;border-bottom-color:var(--org)}

/* ---------- layout ---------- */
#main{max-width:1500px;margin:0 auto;padding:14px 12px 90px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 0 12px;flex-wrap:wrap}
.vh h2{font-size:21px}
.vh .s{font-size:12px;color:var(--body);margin-top:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(175px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}

.card{background:var(--card);border:1px solid var(--tan);border-radius:var(--rad);
  padding:13px 14px;box-shadow:var(--sh)}
.card h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--slate);margin-bottom:9px}
.card.dk{background:var(--dark);color:#fff;border-color:var(--dark)}
.card.dk h3{color:#9fb3b6}

/* KPI card (§22) */
.kpi{background:#fff;border:1px solid var(--tan);border-radius:var(--rad);padding:12px 13px;box-shadow:var(--sh)}
.kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--mut);font-weight:700}
.kpi .v{font-size:27px;font-weight:800;line-height:1.15;margin:3px 0 1px;color:var(--dark)}
.kpi .v.o{color:var(--org)}.kpi .v.n{color:var(--neg)}.kpi .v.g{color:var(--grn)}
.kpi .c{font-size:11px;color:var(--body)}
.kpi.acc{border-left:4px solid var(--org)}

/* ---------- tables ---------- */
.tw{overflow-x:auto;border:1px solid var(--tan);border-radius:var(--rad);background:#fff}
table{border-collapse:collapse;width:100%;font-size:12.5px}
thead th{background:var(--dark);color:#fff;font-weight:700;text-align:left;padding:8px 9px;
  white-space:nowrap;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0}
thead th.o{background:var(--org)}
thead tr.grp th{background:var(--slate);text-align:center;font-size:11px}
tbody td{padding:7px 9px;border-top:1px solid #eee;vertical-align:top}
tbody tr:nth-child(even){background:var(--pale)}
tbody tr:hover{background:#fdf2ea}
tbody tr.tot{background:#fff!important;font-weight:800;border-top:2px solid var(--org)}
tbody tr.tot td{color:var(--org2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.neg{color:var(--neg);font-weight:700}
td.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px}
.rag{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.rag.g{background:var(--grn)}.rag.a{background:var(--amb)}.rag.r{background:var(--red)}
.tag{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10.5px;font-weight:700;
  background:var(--pale);color:var(--slate);white-space:nowrap}
.tag.o{background:var(--org);color:#fff}.tag.g{background:#e3f4ec;color:var(--grn)}
.tag.r{background:#fdeaea;color:var(--red)}.tag.a{background:#fdf4e0;color:#8a6800}
.tag.d{background:var(--dark);color:#fff}

/* bar */
.bar{height:9px;border-radius:5px;background:#e6e0da;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--org)}
.bar.pl>i{background:#9aa8a8}
.bb{display:flex;align-items:center;gap:7px}
.bb .bar{flex:1}

/* ---------- forms ---------- */
label.f{display:block;margin-bottom:9px}
label.f>span{display:block;font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.5px;color:var(--slate);margin-bottom:3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--tan);border-radius:8px;
  background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--org);box-shadow:0 0 0 3px rgba(239,105,37,.14)}
input.yel,textarea.yel{background:#FFFBE6}
input[readonly]{background:#F2F6F7;color:var(--body)}
textarea{min-height:74px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:8px;border:1px solid var(--tan);
  background:#fff;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--org);color:var(--org2)}
.btn.p{background:var(--org);border-color:var(--org);color:#fff}
.btn.p:hover{background:var(--org2);color:#fff}
.btn.d{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.d:hover{background:var(--dark2);color:#fff}
.btn.sm{padding:5px 10px;font-size:11.5px}
.btn.gh{background:transparent;border-color:transparent;color:var(--slate)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--tan);background:#fff;
  font-size:12px;font-weight:600;cursor:pointer}
.chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.chip.on.o{background:var(--org);border-color:var(--org)}

/* ---------- activity picker rows ---------- */
.arow{border:1px solid var(--tan);border-radius:10px;background:#fff;padding:10px 11px;margin-bottom:8px}
.arow.done{border-left:4px solid var(--grn)}
.arow.part{border-left:4px solid var(--org)}
.arow .ah{display:flex;gap:9px;align-items:flex-start}
.arow .ac{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;color:var(--mut)}
.arow .an{font-weight:700;font-size:13px;line-height:1.3}
.arow .am{font-size:11px;color:var(--body);margin-top:3px}
.arow .aq{margin-top:9px;display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(115px,1fr))}
.mini{font-size:10.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.5px}

/* ---------- toast / modal ---------- */
#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:200;
  background:var(--dark);color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;font-weight:600;
  box-shadow:0 8px 26px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw}
#toast.s{opacity:1;transform:translateX(-50%) translateY(-6px)}
#toast.err{background:var(--red)}
#modal{position:fixed;inset:0;z-index:150;background:rgba(17,37,40,.55);display:flex;
  align-items:center;justify-content:center;padding:14px}
#mbox{background:#fff;border-radius:14px;max-width:660px;width:100%;max-height:88vh;overflow:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.35)}
#mhd{padding:13px 16px;border-bottom:1px solid var(--tan);display:flex;justify-content:space-between;
  align-items:center;position:sticky;top:0;background:#fff;z-index:2}
#mbd{padding:15px 16px}
#mft{padding:12px 16px;border-top:1px solid var(--tan);display:flex;gap:8px;justify-content:flex-end;
  position:sticky;bottom:0;background:#fff}

/* ---------- charts ---------- */
.chw{position:relative;width:100%}
canvas{display:block;width:100%}

/* ---------- misc ---------- */
.note{background:#FFFBE6;border:1px solid #F0DFA8;border-radius:9px;padding:10px 12px;font-size:12.5px;color:#6b5a1e}
.note.r{background:#fdeaea;border-color:#f4c4c4;color:#8a2020}
.note.b{background:var(--pale);border-color:#c9dde1;color:var(--slate)}
.empty{text-align:center;padding:34px 14px;color:var(--mut);font-size:13px}
.sep{height:1px;background:var(--tan);margin:14px 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed #eee;font-size:12.5px}
.kv b{font-variant-numeric:tabular-nums}
.fabs{position:fixed;right:14px;bottom:16px;z-index:70;display:flex;flex-direction:column;gap:9px}
.fab{width:54px;height:54px;border-radius:50%;background:var(--org);color:#fff;border:0;font-size:23px;
  box-shadow:0 6px 18px rgba(239,105,37,.45);cursor:pointer;display:flex;align-items:center;justify-content:center}
.ph{width:74px;height:74px;object-fit:cover;border-radius:8px;border:1px solid var(--tan);cursor:pointer}
.scroll{max-height:460px;overflow:auto}
@media(max-width:640px){
  #main{padding:11px 9px 96px}
  .kpi .v{font-size:22px}
  .vh h2{font-size:18px}
  #ttl{font-size:13px}#sub{display:none}
}
@media print{
  #top,#nav,.fabs,.noprint{display:none!important}
  body{background:#fff}
  .card{break-inside:avoid;box-shadow:none}
  .print-legend{display:block!important;margin-bottom:6px}
  .pv-page{break-after:page}
  .pv-page:last-child{break-after:auto}
  .elevsvg{height:250px!important;width:100%!important}
  .upsvg{height:400px!important;width:100%!important;min-width:0!important}
  .brsvg{height:430px!important;width:100%!important;min-width:0!important;max-width:none!important}
  .pvasvg{height:430px!important;width:100%!important;min-width:0!important;max-width:none!important}
  .pvagrid .upsvg{height:300px!important}
  .pvagrid{gap:6px!important}
  .fitsheet{zoom:.77}
  .fitsheet .ovsvg{height:295px!important}
  .fitsheet .orow{grid-template-columns:minmax(330px,430px) 1fr!important;gap:10px!important;margin-bottom:2px!important}
  .fitsheet .cmpk{margin-bottom:4px!important}
  .fitsheet .cmpk .kpi{padding:3px 9px}
  .fitsheet .bridgeband{margin:7px 0 4px;padding:4px 9px}
  .fitsheet .sheethead{padding:6px 12px}
  .statwrap table{font-size:9.5px}
  .statwrap tbody td{padding:3px 7px}
  .statwrap thead th{padding:4px 7px;font-size:9px}
  .statwrap .kpi{padding:6px 9px}
  .statwrap .kpi .v{font-size:21px}
  .statwrap .kpi .l{font-size:9px}
  .statwrap .kpi .c{font-size:9.5px}
}

/* compact slide-block variants (overview columns) */
.cmp table{font-size:10px}
.cmp tbody td{padding:2px 6px}
.cmp thead th{padding:3px 6px;font-size:9px;letter-spacing:.2px}
.cmpk .kpi{padding:7px 10px}
.cmpk .kpi .l{font-size:10px;letter-spacing:.5px}
.cmpk .kpi .v{font-size:24px;margin:1px 0 0}
.cmpk .kpi .c{font-size:11px}

/* ===== Roads & Services strip-map ===== */
.rdrow{display:grid;grid-template-columns:210px 1fr 110px;gap:8px;align-items:center;
  padding:2px 0;border-bottom:1px dashed #EFE9E2}
.rdrow:hover{background:#FDF6F0}
.rdlab{font-size:11.5px;color:#112528;line-height:1.25;overflow:hidden}
.rdlab b{display:block;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rdlab span{font-size:10px;color:#7A8888}
.rdsvg{display:block;width:100%;height:22px}
.rdpct{text-align:right;font-variant-numeric:tabular-nums;line-height:1.15}
.rdpct b{font-size:12.5px;color:#112528;display:block}
.rdpct span{font-size:10px;color:#355056}
.rdzone{font-size:10.5px;font-weight:800;letter-spacing:.07em;color:#D2600F;
  background:#FDF3EB;border-left:4px solid #EF6925;padding:3px 9px;margin:9px 0 3px;border-radius:0 6px 6px 0}
@media print{
  .rdrow{grid-template-columns:180px 1fr 96px;padding:1px 0}
  .rdsvg{height:16px}
  .rdlab b{font-size:10px}.rdlab span{font-size:8.5px}
  .rdpct b{font-size:10.5px}.rdpct span{font-size:8.5px}
  .rdzone{padding:2px 8px;margin:6px 0 2px;font-size:9.5px}
  .rdcard{break-inside:auto}
}

/* ===== Structures — house sheet chrome (§22 palette) ===== */
.sheethead{background:var(--dark);color:#fff;border-radius:8px 8px 0 0;padding:9px 14px;
  margin:-14px -14px 10px -14px;border-bottom:3px solid var(--org);
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sheethead h3{color:#fff!important;margin:0;font-size:14px;letter-spacing:.8px}
.sheethead .r{font-size:10.5px;color:#9fb3b6;text-align:right;line-height:1.35}
.bridgeband{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--pale);border-left:6px solid var(--org);padding:6px 10px;border-radius:6px;margin:12px 0 6px}
.bridgeband h3{margin:0!important;font-size:12.5px;color:var(--dark);letter-spacing:.5px}
.housenote{background:#FDF3EB;border-left:6px solid var(--org);border-radius:6px;
  padding:8px 12px;margin-top:8px;font-size:12px;color:var(--body);line-height:1.5}
.housenote .k{display:block;color:var(--org2);letter-spacing:.08em;font-size:10px;font-weight:800;
  text-transform:uppercase;margin-bottom:2px}
.print-legend{display:none}
</style>
</head>

<div id="boot" style="padding:60px 20px;text-align:center;font:14px Segoe UI;color:#5B493C">
  <div style="width:52px;height:52px;margin:0 auto 14px;border-radius:12px;background:linear-gradient(135deg,#EF6925,#D2600F)"></div>
  <b style="color:#112528;font-size:16px">R2200 SiteTrack</b><br>Loading baseline…
</div>

<div id="app" class="hide">

  </div></div>

</div>

/* ============================================================

'use strict';

/* ---------- tiny DOM ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
function el(tag, attrs, kids) {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') n.className = attrs[k];
    else if (k === 'html') n.innerHTML = attrs[k];
    else if (k === 'text') n.textContent = attrs[k];
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] != null && attrs[k] !== false) n.setAttribute(k, attrs[k]);
  }
  if (kids) (Array.isArray(kids) ? kids : [kids]).forEach(c => c && n.appendChild(
    typeof c === 'string' ? document.createTextNode(c) : c));
  return n;
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- numbers & dates (house rules §4) ---------- */
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function n2(v) { return (isFinite(v) ? v : 0).toFixed(2); }
function nf(v, d) { d = d == null ? 2 : d;
  return (isFinite(v) ? v : 0).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function aed(v) { return 'AED ' + nf(v, 2); }
function aedM(v) { return 'AED ' + nf(v / 1e6, 2) + 'M'; }
function pct(v) { return n2(v) + '%'; }
function sgn(v) { return (v >= 0 ? '+' : '') + n2(v) + '%'; }
/** DD-MMM-YY (house standard) */
function dmy(iso) {
  if (!iso) return '—';
  const d = typeof iso === 'string' ? new Date(iso + 'T00:00:00') : iso;
  if (isNaN(d)) return '—';
  return String(d.getDate()).padStart(2, '0') + '-' + MON[d.getMonth()] + '-' + String(d.getFullYear()).slice(2);
}
function iso(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function pd(s) { return s ? new Date(s + 'T00:00:00') : null; }
function days(a, b) { const A = pd(a), B = pd(b); if (!A || !B) return 0; return Math.round((B - A) / 864e5); }
function addD(s, n) { const d = pd(s); d.setDate(d.getDate() + n); return iso(d); }
function monKey(s) { return s ? s.slice(0, 7) : ''; }
function monLbl(k) { return MON[+k.slice(5, 7) - 1] + '-' + k.slice(2, 4); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }

/* ---------- toast ---------- */
let _tt;
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg;
  t.className = 's' + (err ? ' err' : '');
  clearTimeout(_tt); _tt = setTimeout(() => t.className = '', err ? 5200 : 2600);
}

/* ---------- modal ---------- */
function modal(title, bodyNode, buttons) {
  const wrap = $('#modal'); wrap.classList.remove('hide');
  $('#mtitle').textContent = title;
  const bd = $('#mbd'); bd.innerHTML = ''; bd.appendChild(bodyNode);
  const ft = $('#mft'); ft.innerHTML = '';

    ft.appendChild(el('button', { class: b.c || 'btn', onclick: () => b.f && b.f() }, b.t));
  });
  return wrap;
}
function closeModal() { $('#modal').classList.add('hide'); $('#mbd').innerHTML = ''; $('#mbox').style.maxWidth = ''; }

/* ---------- confirm ---------- */
function ask(title, msg, onYes, yesLabel) {

    { t: 'Cancel', c: 'btn', f: closeModal },

}

/* ============================================================
   STORAGE — IndexedDB, with localStorage / memory fallback.
   Records are append-friendly documents keyed by id, each with
   `rev` (device clock) + `dev` so the server can merge safely.
   ============================================================ */
const STORES = ['progress', 'diary', 'event', 'ir', 'photo', 'meta', 'outbox'];
const DB = {
  mode: 'idb', db: null, mem: {},
  async open() {
    STORES.forEach(s => this.mem[s] = this.mem[s] || {});
    try {
      this.db = await new Promise((res, rej) => {
        const rq = indexedDB.open('r2200-sitetrack', 3);
        rq.onupgradeneeded = e => {
          const d = e.target.result;
          STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); });
        };
        rq.onsuccess = e => res(e.target.result);
        rq.onerror = e => rej(e.target.error);
        rq.onblocked = () => rej(new Error('blocked'));
        setTimeout(() => rej(new Error('idb timeout')), 4000);
      });
      this.mode = 'idb';
    } catch (e) {
      try {
        localStorage.setItem('__t', '1'); localStorage.removeItem('__t');
        this.mode = 'ls';
      } catch (e2) { this.mode = 'mem'; }
      console.warn('IndexedDB unavailable →', this.mode, e && e.message);
    }
    // hydrate memory mirror (all reads are synchronous from the mirror)
    for (const s of STORES) {
      if (this.mode === 'idb') {
        const rows = await this._all(s);
        rows.forEach(r => this.mem[s][r.id] = r);
      } else if (this.mode === 'ls') {
        try { this.mem[s] = JSON.parse(localStorage.getItem('r2200_' + s) || '{}'); } catch (e) { this.mem[s] = {}; }
      }
    }
    return this.mode;
  },
  _all(store) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction(store, 'readonly').objectStore(store).getAll();
      tx.onsuccess = () => res(tx.result || []); tx.onerror = () => rej(tx.error);
    });
  },
  _flushLS(store) {
    try { localStorage.setItem('r2200_' + store, JSON.stringify(this.mem[store])); }
    catch (e) { toast('Local storage full — export and sync today\'s data now.', true); }
  },
  /** put a record (adds id/rev/dev/user stamps) */
  put(store, rec, noQueue) {
    rec.id = rec.id || uid();
    rec.rev = Date.now();
    rec.dev = ST.deviceId;
    rec.user = rec.user || (ST.user && ST.user.id) || 'unknown';
    this.mem[store][rec.id] = rec;
    if (this.mode === 'idb') {
      try { this.db.transaction(store, 'readwrite').objectStore(store).put(rec); } catch (e) { console.warn(e); }
    } else if (this.mode === 'ls') this._flushLS(store);
    if (!noQueue && store !== 'outbox' && store !== 'meta') this.queue(store, rec);
    return rec;
  },
  del(store, id) {
    const r = this.mem[store][id];
    if (r) { r.deleted = 1; r.rev = Date.now(); this.put(store, r); }
  },
  get(store, id) { return this.mem[store][id]; },
  all(store) { return Object.values(this.mem[store] || {}).filter(r => !r.deleted); },
  allRaw(store) { return Object.values(this.mem[store] || {}); },
  queue(store, rec) {
    this.put('outbox', { id: 'q_' + store + '_' + rec.id, store: store, ref: rec.id }, true);
    SYNC.schedule();
  },
  clearQueue(ids) { ids.forEach(id => { delete this.mem.outbox[id];
    if (this.mode === 'idb') { try { this.db.transaction('outbox', 'readwrite').objectStore('outbox').delete(id); } catch (e) {} } });
    if (this.mode === 'ls') this._flushLS('outbox');
  },
  pending() { return Object.values(this.mem.outbox || {}).length; },
  setMeta(k, v) { this.put('meta', { id: k, v: v }, true); },
  getMeta(k, d) { const r = this.mem.meta[k]; return r ? r.v : d; }
};

/* ---------- image compression (photos) ---------- */
function compressImage(file, maxPx, quality) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        let { width: w, height: h } = im;
        const m = maxPx || 1280;
        if (w > m || h > m) { const s = m / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
        const cv = el('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(im, 0, 0, w, h);
        res(cv.toDataURL('image/jpeg', quality || 0.72));
      };
      im.onerror = rej; im.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

/* ---------- CSV ---------- */

  return rows.map(r => r.map(c => {
    const s = c == null ? '' : String(c);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',')).join('\r\n');
}

  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* ---------- gzip helpers (browser-native) ---------- */
async function gunzipB64(b64) {
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  if (typeof DecompressionStream !== 'function') pako_inflate_fallback();
  const st = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(st).text();
}
async function gzipToB64(txt) {
  if (typeof CompressionStream !== 'function') return null;   // caller stores raw instead
  const st = new Blob([txt]).stream().pipeThrough(new CompressionStream('gzip'));
  const buf = new Uint8Array(await new Response(st).arrayBuffer());
  let s = ''; const CH = 0x8000;
  for (let i = 0; i < buf.length; i += CH) s += String.fromCharCode.apply(null, buf.subarray(i, i + CH));
  return btoa(s);
}

/* ---------- baseline decode ----------
   Order: imported baseline override (from the in-app XER importer, stored in
   this device's DB and distributed by the server) → the embedded baseline. */
async function loadBaseline() {
  const ov = DB.getMeta('blOverride', null);
  let raw = null;
  if (ov && (ov.b64 || ov.raw)) {
    try { raw = JSON.parse(ov.b64 ? await gunzipB64(ov.b64) : ov.raw); }
    catch (e) { console.warn('baseline override unreadable — falling back to embedded', e); raw = null; }
  }
  if (raw) {
    CURVE = ov.basis === 'xer' ? synthCurve(raw) : CURVE_ISSUED;
  } else {
    CURVE = CURVE_ISSUED;
    raw = JSON.parse(await gunzipB64(document.getElementById('bl').textContent.trim()));
  }
  ST.BL = buildModel(raw);
  ST.BL.override = raw && ov && (ov.b64 || ov.raw) ? { ver: ov.ver, label: ov.label, basis: ov.basis, at: ov.at, by: ov.by } : null;
  return ST.BL;
}
function pako_inflate_fallback() { throw new Error('This browser is too old — please use Chrome or Edge.'); }

/* ---------- synthesized planned curve (basis = the imported XER itself) ----------
   Monthly cost-weighted cumulative Planned Early / Late computed straight from
   the imported programme's dates and cost loading — used when a revised
   baseline is imported with "planned curve from this XER". Same shape as the
   issued-workbook CURVE so every existing consumer works unchanged. ---------- */
function synthCurve(raw) {
  const acts = raw.acts, meta = raw.meta;
  let total = 0; acts.forEach(a => total += (a.c || 0));
  const lo = meta.plan_start || acts.reduce((m, a) => a.es && (!m || a.es < m) ? a.es : m, null);
  const hi = meta.scd_end || acts.reduce((m, a) => a.lf && (!m || a.lf > m) ? a.lf : m, null);
  const months = [];
  if (lo && hi) {
    let k = monKey(lo);
    const kEnd = monKey(hi);
    let prevE = 0, prevL = 0, guard = 0;
    while (k <= kEnd && guard++ < 200) {
      const y = +k.slice(0, 4), mo = +k.slice(5, 7);
      const dim = new Date(y, mo, 0).getDate();
      let end = k + '-' + String(dim).padStart(2, '0');
      if (end > hi) end = hi;
      let ce = 0, cl = 0;
      acts.forEach(a => { if (a.c) { ce += a.c * plannedRawAt(a, end, false) / 100; cl += a.c * plannedRawAt(a, end, true) / 100; } });
      months.push({ k: k, ce: ce, cl: cl, pe: ce - prevE, pl: cl - prevL });
      prevE = ce; prevL = cl;
      k = monKey(addD(k + '-01', 32));
    }
    if (months.length) { months[months.length - 1].ce = total; months[months.length - 1].cl = total; }
  }
  return { total: total, months: months, src: 'Imported XER — ' + (meta.xer || 'programme') + ' (planned from its own dates & cost loading)' };
}
/* plannedRaw for a plain act object (not yet through buildModel) */
function plannedRawAt(a, dd, late) {
  const s = late ? a.ls : a.es, f = late ? a.lf : a.ef;
  if (!s || !f) return 0;
  if (dd < s) return 0;
  if (dd >= f) return 100;
  const span = Math.max(1, days(s, f) + 1);
  return Math.min(100, Math.max(0, (days(s, dd) + 1) / span * 100));
}

/* ---------- derived grouping rules ---------- */
const AREA_GROUP = {
  'Bridge 1': 'Bridges', 'Bridge 2': 'Bridges', 'Bridge 3': 'Bridges',
  'Bridge Works': 'Bridges', 'Box Culvert': 'Structures', 'Precast Yard': 'Structures',
  'Structural Metalwork': 'Structures'
};
const BRIDGE_NAME = { B1: 'Bridge 1', B2: 'Bridge 2', B3: 'Bridge 3' };
function deriveArea(k, wbs, kn) {
  kn = kn || {};
  if (k.Bridges) return BRIDGE_NAME[k.Bridges] || String(kn.Bridges || k.Bridges).replace('Bridge-', 'Bridge ');
  if (kn.Zones) return kn.Zones;
  const w = (wbs || []).join(' / ').toLowerCase();
  if (w.indexOf('culvert') >= 0) return 'Box Culvert';
  if (w.indexOf('precast') >= 0) return 'Precast Yard';
  const bn = k['L02-BOQ-Sections-name'];
  if (bn && bn !== 'Unassigned') return bn;
  return (wbs && wbs[0]) || 'General';
}
function areaGroup(area) {
  if (AREA_GROUP[area]) return AREA_GROUP[area];
  if (/^Zone-/.test(area) || area === 'Main Roads' || area === 'Roads and Pavings') return 'Roads & Zones';
  if (/SEWA|Etisalat|Gas|Irrigation|Sewerage|Drainage|DU|Lighting|Armed/i.test(area)) return 'Services';
  return 'General & Enabling';
}
const BOQ_NAME = {
  'P1-Gen': 'General Items', 'P2-GI': 'Ground Investigation', 'P3-D&S': 'Demolition & Site Clearance',
  'P5-ST.W': 'Structural Metalwork', 'P6-RW': 'Roads and Pavings', 'P7-BW': 'Bridge Works',
  'P8-Cul': 'Box Culvert Works', 'P9-PW': 'SEWA — Water', 'P10-ELE': 'SEWA — Electricity',
  'P11-ETI': 'Etisalat', 'P12-IRR': 'SM — Irrigation', 'P13-SWD': 'SM — Drainage',
  'P14-SEW': 'SM — Sewerage', 'P15-SL': 'Road Lighting', 'P17-TEL': 'EITC — DU / ITS',
  'P21-GAS': 'Gas Pipeline', 'AF': 'Armed Forces', 'NONE': 'Unassigned'

/* ---------- build the model ---------- */
function buildModel(raw) {
  const acts = raw.acts, TOT = raw.meta.total_cost;
  const byId = {};
  acts.forEach(a => {
    a.k = a.k || {}; a.kn = a.kn || {};
    const nm = (key) => a.kn[key] || a.k[key] || '';
    a.boq = a.k['L02-BOQ-Sections'] || 'NONE';
    a.boqName = BOQ_NAME[a.boq] || a.boq;
    a.k['L02-BOQ-Sections-name'] = a.boqName;
    a.area = deriveArea(a.k, a.w, a.kn);
    a.grp = areaGroup(a.area);
    a.isMile = a.ms === 1;                             // TT_Mile in the XER
    a.ms = a.k['Milestones'] || 'Not milestone-coded'; // never dropped — conservation stays at 100%
    a.phase = (a.w && a.w[0]) || 'General';
    /* ---- filter dimensions: short code kept for the label, name for reading ---- */
    a.disc = nm('Activity Codes');                                    // Formwork, Concrete, Piling…
    a.road = nm('Road Names');
    a.roadCode = a.k['Road Names'] || '';
    a.roadLbl = a.roadCode ? (a.roadCode + ' — ' + a.road) : '';
    a.elem = nm('Bridge Elements');                                   // Deck Slab, Pile Cap, Pier Column…
    a.loc = nm('Element Location');                                   // Pier-1, Span-02, Abutment-01…
    a.sec = nm('Bridge Sections');
    a.svc = nm('L3-Services');                                        // Carriageway, Footpath, Parking…
    a.zone = nm('Zones');
    a.bridge = a.k['Bridges'] ? (BRIDGE_NAME[a.k['Bridges']] || nm('Bridges')) : '';
    a.rtype = nm('Road Type');
    a.crew = nm('Crew');
    a.seq = nm('Seq');
    a.subm = nm('L02-WBS');                                           // Shop Drawing, Material, MS…
    a.w8 = TOT ? a.c / TOT : 0;                       // cost weight
    a.durc = Math.max(1, days(a.es, a.ef) + 1);       // calendar span, early
    a.durl = Math.max(1, days(a.ls, a.lf) + 1);       // calendar span, late
    a.rate = a.rt ? parseFloat(a.rt) : (a.q && a.d ? a.q / a.d : 0);   // planned output/day
    byId[a.i] = a;
  });
  const areas = {}, boqs = {}, mss = {}, grps = {};
  acts.forEach(a => {
    (areas[a.area] = areas[a.area] || { n: 0, c: 0, grp: a.grp }).n++; areas[a.area].c += a.c;
    (boqs[a.boq] = boqs[a.boq] || { n: 0, c: 0, name: a.boqName }).n++; boqs[a.boq].c += a.c;
    (mss[a.ms] = mss[a.ms] || { n: 0, c: 0 }).n++; mss[a.ms].c += a.c;
    (grps[a.grp] = grps[a.grp] || { n: 0, c: 0 }).n++; grps[a.grp].c += a.c;
  });
  return {
    meta: raw.meta, acts: acts, byId: byId, TOT: TOT,
    BUDGET: CURVE.total || TOT,      // issued workbook value — governs reported budget
    curveSrc: CURVE.src,
    areas: areas, boqs: boqs, mss: mss, grps: grps,
    start: acts.reduce((m, a) => a.es && (!m || a.es < m) ? a.es : m, null),
    end: acts.reduce((m, a) => a.ef && (!m || a.ef > m) ? a.ef : m, null),
    trades: uniqKeys(acts, 'tr'), equips: uniqKeys(acts, 'eq')

}
function uniqKeys(acts, f) {
  const s = {};
  acts.forEach(a => { if (a[f]) for (const k in a[f]) s[k] = (s[k] || 0) + a[f][k]; });
  return Object.keys(s).sort((x, y) => s[y] - s[x]).map(k => ({ name: k, h: s[k] }));
}

/* ============================================================
   PLANNED % — governed by the ISSUED S-curve workbook
   ------------------------------------------------------------
   The project-level Planned Early / Planned Late come straight from
   `S Curve-Revised.xlsx` (the accepted curve). The workbook has no
   activity detail, so each activity keeps its own linear shape across
   its baseline span, and that shape is calibrated by a single factor
   per data date so the cost-weighted total lands exactly on the issued
   curve. Every breakdown therefore reconciles to the issued figure —
   nothing is dropped and nothing is invented at activity level.
   ============================================================ */
/** raw XER basis: linear elapsed on the activity's baseline calendar span */
function plannedRaw(a, dd, late) {
  const s = late ? a.ls : a.es, f = late ? a.lf : a.ef;
  if (!s || !f) return 0;
  if (dd < s) return 0;
  if (dd >= f) return 100;
  const span = Math.max(1, days(s, f) + 1);
  return Math.min(100, Math.max(0, (days(s, dd) + 1) / span * 100));
}
/** cumulative AED on the issued curve at a data date (linear within the month) */
function curveCum(dd, late) {
  const M = CURVE.months; if (!M || !M.length) return 0;
  // the workbook buckets by month; the programme finishes mid-month, so the
  // final month is complete at the scheduled finish, not at month end.
  if (ST.BL && ST.BL.meta.scd_end && dd >= ST.BL.meta.scd_end) return CURVE.total;
  const key = monKey(dd);
  if (key < M[0].k) return 0;
  if (key > M[M.length - 1].k) return CURVE.total;
  let idx = -1;
  for (let i = 0; i < M.length; i++) if (M[i].k === key) { idx = i; break; }
  if (idx < 0) return CURVE.total;
  const prev = idx > 0 ? (late ? M[idx - 1].cl : M[idx - 1].ce) : 0;
  const cur = late ? M[idx].cl : M[idx].ce;
  const y = +key.slice(0, 4), mo = +key.slice(5, 7);
  const dim = new Date(y, mo, 0).getDate();
  return prev + (cur - prev) * (Math.min(dim, +dd.slice(8, 10)) / dim);
}
function curvePct(dd, late) { return CURVE.total ? curveCum(dd, late) / CURVE.total * 100 : 0; }

/** cost-weighted raw XER planned % across the whole programme at date t */
function xerPct(t, late) {
  let s = 0; const T = ST.BL.TOT || 1;
  ST.BL.acts.forEach(a => { if (a.c) s += a.c * plannedRaw(a, t, late); });
  return s / T;
}
/* ------------------------------------------------------------
   TIME ALIGNMENT (not amplitude scaling).
   The issued curve gives the project % at the data date. We find the
   date on the XER's own cost spread that reaches the same %, and read
   every activity at THAT date. An activity therefore still runs 0 → 100
   across its own span — only the point we read it at moves. A small
   residual factor (< ~1%, one day's worth of curve) closes the last gap
   so the roll-up lands on the issued figure.
   ------------------------------------------------------------ */
let _alMap = {}, _alN = 0;
function align(dd) {
  if (_alMap[dd]) return _alMap[dd];
  if (_alN > 400) { _alMap = {}; _alN = 0; }
  const lo0 = ST.BL.meta.plan_start, hi0 = ST.BL.meta.scd_end;
  const solve = (late) => {
    const target = curvePct(dd, late);
    if (target <= 0) return { t: lo0, f: 1 };
    if (target >= 100) return { t: hi0, f: 1 };
    let lo = lo0, hi = hi0;
    for (let i = 0; i < 12 && days(lo, hi) > 1; i++) {
      const mid = addD(lo, Math.floor(days(lo, hi) / 2));
      if (xerPct(mid, late) < target) lo = mid; else hi = mid;
    }
    const t = xerPct(hi, late) - target <= target - xerPct(lo, late) ? hi : lo;
    const at = xerPct(t, late);
    return { t: t, f: at > 0 ? target / at : 1 };
  };
  const e = solve(false), l = solve(true);
  _alN++;
  return (_alMap[dd] = { dd: dd, te: e.t, tl: l.t, fe: e.f, fl: l.f,
                         isE: curvePct(dd, false), isL: curvePct(dd, true) });
}
function plannedPct(a, dd, late) {
  const A = align(dd);
  const v = plannedRaw(a, late ? A.tl : A.te, late) * (late ? A.fl : A.fe);
  return Math.min(100, Math.max(0, v));
}

/* ---------- planned-% index at a date ----------
   Same shape as actualIndex ({actId:{a:pct}}) but from the BASELINE EARLY
   dates (issued S-curve aligned) — used by the Planned-vs-Actual drawings,
   so the same colouring functions render either side untouched. ---------- */
function plannedIndex(dd) {
  const px = {};
  ST.BL.acts.forEach(a => { const v = plannedPct(a, dd, false); if (v > 0.005) px[a.i] = { a: v }; });
  return px;
}

/* ---------- actual % from captured progress ----------
   An activity can carry BOTH quantity entries (daily deltas, summed) and
   cumulative-% entries (latest one governs — so a wrong % can be corrected
   by simply entering the right one). The activity's actual % is the HIGHER
   of the two readings, capped at 100. ---------- */
function actualIndex(upto) {
  const ix = {};
  DB.all('progress').forEach(p => {
    if (upto && p.date > upto) return;
    if (p.void) return;                 // voided entries stay in the register but count for nothing
    if (p.mode === 'member') return;    // member markers (pile 1 of 2…) colour the drawing, not the figures
    const a = ST.BL.byId[p.actId]; if (!a) return;
    const o = ix[p.actId] = ix[p.actId] || { qty: 0, pct: 0, pctKey: '', last: '', first: '', days: {}, modes: {},
                                             ovKey: '', ovVal: 0, ovDate: '', qtyByDate: [] };
    if (p.mode === 'pct' || p.qty == null) {
      const key = (p.date || '') + '|' + (p.rev || 0);
      if (key >= o.pctKey) { o.pct = Math.min(100, Math.max(0, +p.pct || 0)); o.pctKey = key; }
      /* ov:1 = authoritative override (imported-XER value forced by the planner):
         while it is the LATEST cumulative reading it pins the % — even below a
         qty-derived figure — and later site entries build on top of it. */
      if (p.ov && key >= o.ovKey) { o.ovKey = key; o.ovVal = Math.min(100, Math.max(0, +p.pct || 0)); o.ovDate = p.date || ''; }
      o.modes.pct = 1;
    } else { o.qty += (+p.qty || 0); o.modes.qty = 1; o.qtyByDate.push([p.date || '', +p.qty || 0]); }
    o.days[p.date] = (o.days[p.date] || 0) + (+p.qty || 0);
    if (!o.first || p.date < o.first) o.first = p.date;
    if (p.date > o.last) o.last = p.date;
  });
  for (const k in ix) {
    const a = ST.BL.byId[k], o = ix[k];
    const qp = a.q ? Math.min(100, o.qty / a.q * 100) : 0;
    if (o.ovKey && o.ovKey === o.pctKey) {
      /* override is the latest reading: it governs; only qty entered AFTER its
         date adds on (site work continuing past the imported data date) */
      const qtyPost = o.qtyByDate.reduce((s, r) => s + (r[0] > o.ovDate ? r[1] : 0), 0);
      const qpPost = a.q ? Math.min(100, qtyPost / a.q * 100) : 0;
      o.a = Math.min(100, o.ovVal + qpPost);
    } else o.a = Math.max(qp, o.pct);
    o.mode = o.modes.qty && o.modes.pct ? 'mixed' : (o.modes.qty ? 'qty' : 'pct');
  }

}

/* ---------- headline roll-up ---------- */
function rollup(dd, filterFn) {
  const ix = actualIndex(dd);
  const acts = filterFn ? ST.BL.acts.filter(filterFn) : ST.BL.acts;
  const csum = acts.reduce((s, a) => s + a.c, 0);
  /* Engineering, Procurement and milestone-only selections carry no loaded
     cost. Cost-weighting them would read 0.00% and be meaningless, so fall
     back to equal weight per activity and flag the basis. */
  const byCount = csum <= 0;
  const wsum = byCount ? (acts.length || 1) : csum;
  let pe = 0, pl = 0, ac = 0, earn = 0, labP = 0;
  acts.forEach(a => {
    const w = byCount ? 1 / wsum : a.c / wsum;
    const p = plannedPct(a, dd, false), q = plannedPct(a, dd, true);
    const v = ix[a.i] ? ix[a.i].a : 0;
    pe += w * p; pl += w * q; ac += w * v;
    earn += (a.lh || 0) * v / 100; labP += (a.lh || 0) * p / 100;
  });
  return {
    n: acts.length, cost: csum, basis: byCount ? 'count' : 'cost', ix: ix,
    pe: pe, pl: pl, ac: ac,
    varE: ac - pe, varL: ac - pl,
    spiE: pe > 0 ? ac / pe : 0, spiL: pl > 0 ? ac / pl : 0,
    earnedMH: earn, plannedMH: labP,
    valE: csum * pe / 100, valA: csum * ac / 100
  };
}

/* ---------- group breakdown (cost-weighted, w.r.t Item / w.r.t Project) ---------- */
function breakdown(dd, keyFn, labelFn, filterFn) {
  const ix = actualIndex(dd), G = {};
  const pool = ST.BL.acts.filter(a => (!filterFn || filterFn(a)) && keyFn(a) != null);
  const byCount = pool.reduce((s, a) => s + a.c, 0) <= 0;   // see rollup()
  pool.forEach(a => {
    const k = keyFn(a);
    const g = G[k] = G[k] || { k: k, label: labelFn ? labelFn(a) : k, cost: 0, n: 0, w: 0,
                               pe: 0, pl: 0, ac: 0, done: 0, wip: 0, basis: byCount ? 'count' : 'cost' };
    const w = byCount ? 1 : a.c;
    g.cost += a.c; g.n++; g.w += w;
    const p = plannedPct(a, dd, false), q = plannedPct(a, dd, true), v = ix[a.i] ? ix[a.i].a : 0;
    g.pe += w * p; g.pl += w * q; g.ac += w * v;
    if (v >= 99.995) g.done++; else if (v > 0) g.wip++;
  });
  const T = ST.BL.TOT;
  const SUB = Object.values(G).reduce((s, g) => s + g.w, 0) || 1;
  const SUBC = Object.values(G).reduce((s, g) => s + g.cost, 0);
  return Object.values(G).map(g => {
    const c = g.w || 1;
    const itemPE = g.pe / c, itemPL = g.pl / c, itemAC = g.ac / c;
    return Object.assign(g, {
      w8: g.w / SUB * 100, w8proj: g.cost / T * 100,
      itemPlanE: itemPE, itemPlanL: itemPL, itemAct: itemAC, itemVar: itemAC - itemPE,
      projPlanE: g.pe / SUB, projPlanL: g.pl / SUB, projAct: g.ac / SUB, projVar: (g.ac - g.pe) / SUB,
      subTotal: SUBC || T, subWeight: SUB,
      spi: itemPE > 0 ? itemAC / itemPE : 0,
      rag: rag(itemAC - itemPE)
    });
  }).sort((a, b) => b.cost - a.cost);
}
function rag(v) { const t = CFG.rag; return v >= t.g ? 'g' : (v >= t.a ? 'a' : 'r'); }
const CFG = { rag: { g: -2, a: -10 }, noticeDays: 28, hrsDay: 8, workDays: 6 };

/* ---------- S-curve series (monthly) — Planned from the ISSUED workbook ---------- */
function curves(dd) {
  const act = {};
  DB.all('progress').forEach(p => {
    const a = ST.BL.byId[p.actId]; if (!a || !a.c) return;
    const share = a.q ? (+p.qty || 0) / a.q : (+p.pct || 0) / 100;
    act[monKey(p.date)] = (act[monKey(p.date)] || 0) + a.c * share;
  });
  const keys = {};
  CURVE.months.forEach(m => keys[m.k] = 1);
  Object.keys(act).forEach(k => keys[k] = 1);
  const sorted = Object.keys(keys).sort();
  const byK = {}; CURVE.months.forEach(m => byK[m.k] = m);
  let ca = 0, lastCe = 0, lastCl = 0;
  return sorted.map(k => {
    const m = byK[k];
    const ce = m ? m.ce : lastCe, cl = m ? m.cl : lastCl;
    lastCe = ce; lastCl = cl;
    ca += (act[k] || 0);
    return { k: k, lbl: monLbl(k), pe: m ? m.pe : 0, pl: m ? m.pl : 0, ac: act[k] || 0,
      ce: ce, cl: cl, ca: ca, future: dd ? k > monKey(dd) : false };
  });
}

/* ---------- time slippage: days behind the issued early curve ---------- */
/** cost-weighted planned % at date t, for the whole project or a subset */
function plannedAtDate(t, filterFn) {
  if (!filterFn) return curvePct(t, false);          // project = the issued curve
  let c = 0, s = 0;
  ST.BL.acts.forEach(a => { if (a.c && filterFn(a)) { c += a.c; s += a.c * plannedPct(a, t, false); } });
  return c ? s / c : 0;
}
/** days behind (+) or ahead (-) the planned-early curve, by binary search on date */
function slippageDays(dd, r, filterFn) {
  const target = r.ac;
  const lo0 = ST.BL.meta.plan_start, hi0 = ST.BL.meta.scd_end;
  if (plannedAtDate(lo0, filterFn) >= target) return days(lo0, dd);
  if (plannedAtDate(hi0, filterFn) <= target) return -days(dd, hi0);
  let lo = lo0, hi = hi0;
  for (let i = 0; i < 12 && days(lo, hi) > 1; i++) {
    const mid = addD(lo, Math.floor(days(lo, hi) / 2));
    if (plannedAtDate(mid, filterFn) < target) lo = mid; else hi = mid;
  }
  return days(hi, dd);
}

/* ---------- resource actuals from diaries ---------- */
function resourceActuals(from, to) {
  const trade = {}, eqp = {}; let mh = 0, eh = 0, dayCount = 0;
  DB.all('diary').forEach(d => {
    if (from && d.date < from) return;
    if (to && d.date > to) return;
    dayCount++;
    const hrs = +d.hrs || CFG.hrsDay;
    (d.manpower || []).forEach(m => {
      const h = (+m.n || 0) * (+m.hrs || hrs);
      trade[m.trade] = (trade[m.trade] || 0) + h; mh += h;
    });
    (d.equipment || []).forEach(e => {
      const h = (+e.work || 0);
      eqp[e.type] = (eqp[e.type] || 0) + h; eh += h;
    });
  });
  return { trade: trade, eqp: eqp, mh: mh, eh: eh, dayCount: dayCount };
}

/* ---------- planned resource by period ---------- */
function plannedResources(from, to) {
  const trade = {}, eqp = {};
  ST.BL.acts.forEach(a => {
    if (!a.es || !a.ef) return;
    const ov = overlapDays(a.es, a.ef, from, to);
    if (ov <= 0) return;
    const frac = ov / Math.max(1, days(a.es, a.ef) + 1);
    if (a.tr) for (const k in a.tr) trade[k] = (trade[k] || 0) + a.tr[k] * frac;
    if (a.eq) for (const k in a.eq) eqp[k] = (eqp[k] || 0) + a.eq[k] * frac;
  });
  return { trade: trade, eqp: eqp,
    mh: Object.values(trade).reduce((a, b) => a + b, 0),
    eh: Object.values(eqp).reduce((a, b) => a + b, 0) };
}
function overlapDays(s, f, a, b) {
  const S = s > a ? s : a, F = f < b ? f : b;
  return S > F ? 0 : days(S, F) + 1;
}

/* ---------- lookahead ---------- */
function lookahead(from, to, filterFn) {
  const ix = actualIndex();
  return ST.BL.acts.filter(a => {
    if (a.isMile && !a.c) { /* keep milestones */ }
    if (!a.es || !a.ef) return false;
    if (filterFn && !filterFn(a)) return false;
    if (a.ef < from || a.es > to) return false;
    return (ix[a.i] ? ix[a.i].a : 0) < 99.995;
  }).sort((a, b) => (a.es < b.es ? -1 : a.es > b.es ? 1 : (a.tf - b.tf)));
}

/* ============================================================
   CHARTS — minimal canvas renderer, house palette
   ============================================================ */
const C = { org: '#EF6925', org2: '#D2600F', dark: '#112528', grey: '#9aa8a8', pale: '#EAF2F4',
  tan: '#DCCEC2', body: '#5B493C', red: '#C62828', green: '#1E8F5A', slate: '#355056' };

function mkCanvas(parent, h) {
  const wrap = el('div', { class: 'chw' });
  const cv = el('canvas');
  wrap.appendChild(cv); parent.appendChild(wrap);
  const dpr = window.devicePixelRatio || 1;
  const w = wrap.clientWidth || 700;
  cv.width = w * dpr; cv.height = h * dpr; cv.style.height = h + 'px';
  const x = cv.getContext('2d'); x.scale(dpr, dpr);
  return { x: x, w: w, h: h, cv: cv };
}
function axis(g, pad, xn, ymax, ylab) {
  const { x } = g;
  x.strokeStyle = '#e6e0da'; x.lineWidth = 1; x.font = '10px Segoe UI'; x.fillStyle = C.body;
  const plotH = g.h - pad.t - pad.b, plotW = g.w - pad.l - pad.r;
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + plotH * i / 4;
    x.beginPath(); x.moveTo(pad.l, y); x.lineTo(pad.l + plotW, y); x.stroke();
    x.textAlign = 'right'; x.fillText(ylab(ymax * (1 - i / 4)), pad.l - 6, y + 3);
  }
  return { plotH, plotW };
}
/** combo: monthly bars + cumulative lines (house style §18) */
function chartCurve(parent, data, opts) {
  opts = opts || {};
  const g = mkCanvas(parent, opts.h || 300), { x } = g;
  const pad = { l: 56, r: 52, t: 12, b: 34 };
  const maxBar = Math.max(1, ...data.map(d => Math.max(d.pe, d.ac)));
  const maxCum = Math.max(1, ...data.map(d => Math.max(d.ce, d.cl, d.ca)));
  const { plotH, plotW } = axis(g, pad, data.length, maxBar, v => (v / 1e6).toFixed(0) + 'M');
  const bw = plotW / data.length;
  data.forEach((d, i) => {
    const bx = pad.l + i * bw;
    const hp = d.pe / maxBar * plotH, ha = d.ac / maxBar * plotH;
    x.fillStyle = '#cdd6d6'; x.fillRect(bx + bw * .16, pad.t + plotH - hp, bw * .34, hp);
    if (d.ac > 0) { x.fillStyle = C.org; x.fillRect(bx + bw * .52, pad.t + plotH - ha, bw * .34, ha); }
    if (i % Math.ceil(data.length / 14) === 0) {
      x.save(); x.translate(bx + bw / 2, g.h - pad.b + 12); x.rotate(-Math.PI / 4);
      x.fillStyle = C.body; x.font = '9.5px Segoe UI'; x.textAlign = 'right'; x.fillText(d.lbl, 0, 0); x.restore();
    }
  });
  const line = (key, col, dash, stopFuture) => {
    x.beginPath(); x.strokeStyle = col; x.lineWidth = 2.2; x.setLineDash(dash || []);
    let started = false;
    data.forEach((d, i) => {
      if (stopFuture && d.future) return;
      const px = pad.l + i * bw + bw / 2, py = pad.t + plotH - d[key] / maxCum * plotH;
      started ? x.lineTo(px, py) : (x.moveTo(px, py), started = true);
    });
    x.stroke(); x.setLineDash([]);
  };
  line('ce', C.dark); line('cl', C.grey, [5, 4]); line('ca', C.org, [], true);
  x.textAlign = 'left'; x.font = '10px Segoe UI'; x.fillStyle = C.body;
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + plotH * i / 4;
    x.fillText((maxCum / 1e6 * (1 - i / 4)).toFixed(0) + 'M', g.w - pad.r + 6, y + 3);
  }
  legend(parent, [['Planned cost / month', '#cdd6d6'], ['Actual earned / month', C.org],
    ['Cum. Planned Early', C.dark], ['Cum. Planned Late', C.grey], ['Cum. Actual', C.org]]);
}
/** horizontal planned-vs-actual bars (§22 management first-look) */
function chartHBars(parent, rows, opts) {
  opts = opts || {};
  const h = Math.max(90, rows.length * 30 + 18);
  const g = mkCanvas(parent, h), { x } = g;
  const lw = opts.labelW || 132, rw = 62, bw = g.w - lw - rw;
  rows.forEach((r, i) => {
    const y = 10 + i * 30;
    x.fillStyle = C.dark; x.font = '600 11.5px Segoe UI'; x.textAlign = 'left';
    x.fillText(clip(x, r.label, lw - 8), 0, y + 12);
    x.fillStyle = '#e6e0da'; rr(x, lw, y + 2, bw, 8, 4); x.fill();
    x.fillStyle = '#9aa8a8'; rr(x, lw, y + 2, bw * Math.min(1, r.planned / 100), 8, 4); x.fill();
    x.fillStyle = C.org; rr(x, lw, y + 13, bw * Math.min(1, r.actual / 100), 8, 4); x.fill();
    x.fillStyle = '#e6e0da'; x.fillRect(lw, y + 13, 0, 0);
    x.textAlign = 'right'; x.font = '700 10.5px Segoe UI'; x.fillStyle = '#7A8888';
    x.fillText(n2(r.planned) + '%', g.w - 4, y + 9);
    x.fillStyle = r.actual < r.planned ? C.red : C.green;
    x.fillText(n2(r.actual) + '%', g.w - 4, y + 21);
  });
  legend(parent, [['Planned', '#9aa8a8'], ['Actual', C.org]]);
}
function chartVBars(parent, rows, opts) {
  opts = opts || {};
  const g = mkCanvas(parent, opts.h || 240), { x } = g;
  const pad = { l: 48, r: 10, t: 12, b: 62 };
  const max = Math.max(1, ...rows.map(r => Math.max(r.planned, r.actual)));
  const { plotH, plotW } = axis(g, pad, rows.length, max, v => nf(v, 0));
  const bw = plotW / Math.max(1, rows.length);
  rows.forEach((r, i) => {
    const bx = pad.l + i * bw;
    x.fillStyle = '#9aa8a8';
    x.fillRect(bx + bw * .14, pad.t + plotH - r.planned / max * plotH, bw * .34, r.planned / max * plotH);
    x.fillStyle = C.org;
    x.fillRect(bx + bw * .5, pad.t + plotH - r.actual / max * plotH, bw * .34, r.actual / max * plotH);
    x.save(); x.translate(bx + bw / 2, g.h - pad.b + 10); x.rotate(-Math.PI / 3.4);
    x.fillStyle = C.body; x.font = '10px Segoe UI'; x.textAlign = 'right'; x.fillText(r.label, 0, 0); x.restore();
  });
  legend(parent, [[opts.pl || 'Planned', '#9aa8a8'], [opts.al || 'Actual', C.org]]);
}
function chartDonut(parent, pctVal, centerTop, centerBot, opts) {
  opts = opts || {};
  const g = mkCanvas(parent, opts.h || 168), { x } = g;
  const cx = g.w / 2, cy = g.h / 2, R = Math.min(g.w, g.h) / 2 - 8, r = R * 0.66;
  const a0 = -Math.PI / 2, a1 = a0 + Math.PI * 2 * Math.min(1, Math.max(0, pctVal / 100));
  x.beginPath(); x.arc(cx, cy, R, 0, Math.PI * 2); x.arc(cx, cy, r, Math.PI * 2, 0, true);
  x.fillStyle = '#e6e0da'; x.fill();
  x.beginPath(); x.arc(cx, cy, R, a0, a1); x.arc(cx, cy, r, a1, a0, true);
  x.fillStyle = opts.col || C.org; x.fill();
  x.textAlign = 'center'; x.fillStyle = C.dark; x.font = '800 20px Segoe UI';
  x.fillText(centerTop, cx, cy + 2);
  x.font = '10px Segoe UI'; x.fillStyle = C.body; x.fillText(centerBot, cx, cy + 17);
}
function legend(parent, items) {
  const d = el('div', { class: 'row', style: 'gap:14px;margin-top:6px;font-size:11px;color:#5B493C' });
  items.forEach(([t, c]) => d.appendChild(el('span', { class: 'row', style: 'gap:5px;align-items:center' },
    [el('i', { style: 'width:11px;height:11px;border-radius:3px;display:inline-block;background:' + c }), t])));
  parent.appendChild(d);
}
function rr(x, a, b, w, h, r) { x.beginPath();
  if (w < r * 2) { x.rect(a, b, Math.max(0, w), h); return; }
  x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r);
  x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }
function clip(x, s, w) { let t = s; while (x.measureText(t).width > w && t.length > 3) t = t.slice(0, -2); return t === s ? s : t + '…'; }

/* ---------- table helper ---------- */

/* ============================================================
   FILTER BAR — cascading, shared by Progress Entry and Look-ahead.
   Every dropdown only offers values that still exist under the OTHER
   active filters, with a live count, so you can never pick a dead end.
   ============================================================ */
/* Ordered to follow the WBS: programme level → section of works → the
   structure/road it belongs to → the element → the location on it. */
const FILTERS = [
  /* 1 · programme level */
  { k: 'phase',  t: 'Main WBS',          v: a => a.phase,  pri: 1, g: 'Programme' },
  { k: 'grp',    t: 'Section of works',  v: a => a.grp,    pri: 1, g: 'Programme' },
  /* 2 · structures */
  { k: 'bridge', t: 'Bridge',            v: a => a.bridge, pri: 1, g: 'Structure' },
  { k: 'sec',    t: 'Bridge section',    v: a => a.sec,    pri: 1, g: 'Structure' },
  { k: 'elem',   t: 'Bridge element',    v: a => a.elem,   pri: 1, g: 'Structure' },
  { k: 'loc',    t: 'Location',          v: a => a.loc,    pri: 1, g: 'Structure' },
  /* 3 · roads & zones */
  { k: 'zone',   t: 'Zone',              v: a => a.zone,   pri: 1, g: 'Roads & zones' },
  { k: 'road',   t: 'Road name',         v: a => a.road,   pri: 1, g: 'Roads & zones', lbl: a => a.roadLbl },
  { k: 'svc',    t: 'Position on road',  v: a => a.svc,    pri: 1, g: 'Roads & zones' },
  /* 4 · the work itself */
  { k: 'disc',   t: 'Type of work',      v: a => a.disc,   pri: 1, g: 'Work' },
  /* more */
  { k: 'boq',    t: 'BOQ part',          v: a => a.boq,    g: 'More', lbl: a => a.boq + ' — ' + a.boqName },
  { k: 'ms',     t: 'Milestone',         v: a => a.ms,     g: 'More' },
  { k: 'area',   t: 'Area',              v: a => a.area,   g: 'More' },
  { k: 'subm',   t: 'Submittal type',    v: a => a.subm,   g: 'More' },
  { k: 'crew',   t: 'Crew',              v: a => a.crew,   g: 'More' },
  { k: 'rtype',  t: 'Road type',         v: a => a.rtype,  g: 'More' }
];
const FGROUPS = ['Programme', 'Structure', 'Roads & zones', 'Work', 'More'];
const FBY = {}; FILTERS.forEach(f => FBY[f.k] = f);

/** does an activity pass every filter except `skip`? */
function passes(a, f, skip) {
  const scope = myAreas();
  if (scope && scope.indexOf(a.area) < 0) return false;
  for (const d of FILTERS) {
    if (d.k === skip) continue;
    const want = f[d.k];
    if (want && d.v(a) !== want) return false;
  }
  if (!skip && f.q) {
    const q = f.q.toLowerCase();
    if ((a.i + ' ' + a.n).toLowerCase().indexOf(q) < 0) return false;
  }
  return true;
}
function filterCount(f) { return ST.BL.acts.filter(a => passes(a, f)).length; }

function filterBar(f, onChange) {
  const card = el('div', { class: 'card' });
  const showAll = !!f._more;
  const narrowed = FILTERS.some(d => f[d.k]);      // has the user picked anything yet?

  /* build every field once, then lay them out group by group */
  const built = {};
  FILTERS.forEach(d => {
    if (!d.pri && !showAll && !f[d.k]) return;
    const seen = {};
    ST.BL.acts.forEach(a => {
      const v = d.v(a); if (!v) return;
      if (!passes(a, f, d.k)) return;
      if (!seen[v]) seen[v] = { n: 0, lbl: (d.lbl ? d.lbl(a) : v) };
      seen[v].n++;
    });
    const keys = Object.keys(seen).sort();
    if (!keys.length && !f[d.k]) {
      // this branch has nothing left under the current selection.
      // Before anything is picked, show it greyed so the shape of the
      // programme is visible. Once narrowed, drop it — that IS the answer.
      if (narrowed) return;
      const dead = sel([{ v: '', t: '— not applicable —' }], '', null);
      dead.disabled = true;
      built[d.k] = fld(d.t, dead);
      return;
    }
    const tot = keys.reduce((s, k) => s + seen[k].n, 0);
    const opts = [{ v: '', t: '— any —  (' + tot + ' coded)' }]
      .concat(keys.map(k => ({ v: k, t: seen[k].lbl + '  (' + seen[k].n + ')' })));
    if (f[d.k] && !seen[f[d.k]]) opts.push({ v: f[d.k], t: f[d.k] + '  (0)' });
    built[d.k] = fld(d.t, sel(opts, f[d.k] || '', v => { f[d.k] = v; onChange(); }));
  });

  FGROUPS.forEach(gname => {
    const fields = FILTERS.filter(d => d.g === gname && built[d.k]);
    if (!fields.length) return;
    card.appendChild(el('div', { class: 'mini', style: 'margin:2px 0 4px' }, gname));
    const grid = el('div', { class: 'grid g4', style: 'margin-bottom:8px' });
    fields.forEach(d => grid.appendChild(built[d.k]));
    if (gname === 'Work') grid.appendChild(fld('Search ID or description',
      inp('text', f.q || '', v => { f.q = v; onChange(true); })));
    card.appendChild(grid);
  });

  /* active filters + controls */
  const active = FILTERS.filter(d => f[d.k]);
  const bar = el('div', { class: 'row', style: 'margin-top:8px;align-items:center' });
  bar.appendChild(el('button', { class: 'btn sm', onclick: () => { f._more = !showAll; onChange(); } },
    showAll ? '− Fewer filters' : '+ More filters'));
  if (active.length || f.q) {
    bar.appendChild(el('button', {
      class: 'btn sm', onclick: () => {
        FILTERS.forEach(d => delete f[d.k]); f.q = ''; onChange();
      }
    }, '✕ Clear all (' + (active.length + (f.q ? 1 : 0)) + ')'));
  }
  active.forEach(d => bar.appendChild(el('span', {
    class: 'tag o', style: 'cursor:pointer', title: 'Remove this filter',
    onclick: () => { delete f[d.k]; onChange(); }
  }, d.t + ': ' + f[d.k] + ' ✕')));
  card.appendChild(bar);
  return card;
}

/* ---------------- PROGRESS ENTRY ---------------- */
function vProgress(m) {
  const f = ST.filters;
  const scope = myAreas();
  const dd = ST.dataDate;
  const date = ST.progDate || iso();
  m.appendChild(vh('Progress Entry', 'Record quantity done — cost-weighted roll-up is automatic',
    el('div', { class: 'row' }, [
      el('div', { style: 'min-width:150px' }, fld('Date of work', inp('date', date, v => { ST.progDate = v; render(); }, 'yel')))
    ])));

  /* filters */
  const fc = filterBar(f, listOnly => { if (listOnly) redrawList(); else render(); });
  fc.appendChild(el('div', { class: 'chips', style: 'margin-top:8px' }, [
    chip('Open only', f.open !== false, () => { f.open = f.open === false ? true : false; render(); }),
    chip('In window (±14d)', !!f.win, () => { f.win = !f.win; render(); }),
    chip('Started', !!f.started, () => { f.started = !f.started; render(); }),
    chip('Quantity activities', !!f.qty, () => { f.qty = !f.qty; render(); })
  ]));
  m.appendChild(fc);

  const listWrap = el('div', { style: 'margin-top:11px' });
  m.appendChild(listWrap);

  function redrawList() {
    listWrap.innerHTML = '';
    const ix = actualIndex();
    let list = ST.BL.acts.filter(a => {
      if (!passes(a, f)) return false;
      if (f.qty && !a.q) return false;
      if (f.started && !(ix[a.i] && ix[a.i].a > 0)) return false;
      if (f.open !== false && ix[a.i] && ix[a.i].a >= 99.995) return false;
      if (f.win && !(a.es <= addD(date, 14) && a.ef >= addD(date, -14))) return false;
      return true;
    });
    listWrap.appendChild(el('div', { class: 'row', style: 'justify-content:space-between;margin-bottom:7px' }, [
      el('span', { class: 'mini' }, list.length + ' activities'),
      el('span', { class: 'mini' }, 'Entering for ' + dmy(date))
    ]));
    if (!list.length) { listWrap.appendChild(el('div', { class: 'empty' }, 'No activities match the filters.')); return; }
    list.slice(0, 300).forEach(a => listWrap.appendChild(progRow(a, ix[a.i], date)));
    if (list.length > 300) listWrap.appendChild(el('div', { class: 'note' }, 'Showing first 300 — narrow the filters to see the rest.'));
  }
  redrawList();
}
function progRow(a, cum, date) {
  const doneP = cum ? cum.a : 0;
  const row = el('div', { class: 'arow ' + (doneP >= 99.995 ? 'done' : doneP > 0 ? 'part' : '') });
  const planned = plannedPct(a, ST.dataDate, false);
  row.appendChild(el('div', { class: 'ah' }, [
    el('div', { style: 'flex:1' }, [
      el('div', { class: 'ac' }, a.i),
      el('div', { class: 'an' }, a.n),
      el('div', { class: 'am' }, [a.area, a.sec, a.elem, a.loc, a.road, a.svc, a.disc]
        .filter(Boolean).filter((v, i, arr) => arr.indexOf(v) === i).join(' · ')),
      el('div', { class: 'am' }, dmy(a.es) + ' → ' + dmy(a.ef) +
        (a.tf <= 0 ? ' · CRITICAL' : ' · TF ' + n2(a.tf) + 'd')),
      el('div', { class: 'bb', style: 'margin-top:7px' }, [
        el('div', { class: 'bar pl' }, el('i', { style: 'width:' + Math.min(100, planned) + '%' })),
        el('span', { class: 'mini' }, 'Plan ' + n2(planned) + '%')
      ]),
      el('div', { class: 'bb', style: 'margin-top:3px' }, [
        el('div', { class: 'bar' }, el('i', { style: 'width:' + Math.min(100, doneP) + '%' })),
        el('span', { class: 'mini', style: doneP < planned ? 'color:#FF0000' : '' }, 'Act ' + n2(doneP) + '%')
      ])
    ]),
    el('button', { class: 'btn sm gh', onclick: () => actDetail(a) }, 'ⓘ')
  ]));

  if (!canEdit()) return row;
  const box = el('div', { class: 'aq' });
  const st = { qty: '', pct: '', note: '', mode: a.q ? 'qty' : 'pct' };
  const fields = el('div', { class: 'aq', style: 'margin-top:0' });
  function drawFields() {
    fields.innerHTML = '';
    if (st.mode === 'qty') {
      const remain = Math.max(0, a.q - (cum ? cum.qty : 0));
      fields.appendChild(fld('Qty today (' + (a.u || '') + ')', inp('number', st.qty, v => st.qty = v, 'yel')));
      fields.appendChild(fld('Cumulative', inp('text', n2(cum ? cum.qty : 0) + ' / ' + n2(a.q), null, '', 1)));
      fields.appendChild(fld('Remaining', inp('text', n2(remain) + ' ' + (a.u || ''), null, '', 1)));
      fields.appendChild(fld('Planned rate/day', inp('text', a.rate ? n2(a.rate) + ' ' + (a.u || '') : '—', null, '', 1)));
    } else {
      fields.appendChild(fld('Cumulative % complete', inp('number', st.pct, v => st.pct = v, 'yel')));
      fields.appendChild(fld('Current actual', inp('text', n2(doneP) + ' %', null, '', 1)));
      if (a.q) fields.appendChild(fld('Baseline quantity', inp('text', n2(a.q) + ' ' + (a.u || ''), null, '', 1)));
      else fields.appendChild(fld('Baseline duration', inp('text', n2(a.d) + ' d', null, '', 1)));
    }
  }
  if (a.q) {
    box.appendChild(el('div', { style: 'grid-column:1/-1' }, el('div', { class: 'chips' }, [
      chip('Enter quantity', st.mode === 'qty', () => { st.mode = 'qty'; redrawChips(); drawFields(); }),
      chip('Enter %', st.mode === 'pct', () => { st.mode = 'pct'; redrawChips(); drawFields(); })
    ])));
  }
  function redrawChips() {
    const ch = box.querySelector('.chips'); if (!ch) return;
    ch.replaceWith(el('div', { class: 'chips' }, [
      chip('Enter quantity', st.mode === 'qty', () => { st.mode = 'qty'; redrawChips(); drawFields(); }),
      chip('Enter %', st.mode === 'pct', () => { st.mode = 'pct'; redrawChips(); drawFields(); })
    ]));
  }
  drawFields();
  box.appendChild(fields);
  row.appendChild(box);
  row.appendChild(el('div', { class: 'row', style: 'margin-top:8px;align-items:flex-end' }, [
    el('div', { style: 'flex:1;min-width:170px' }, fld('Note / location', inp('text', '', v => st.note = v))),
    el('button', {
      class: 'btn p', style: 'margin-bottom:9px', onclick: () => {
        saveProgress(a, st, cum, date, () => render());
      }
    }, 'Save')
  ]));
  return row;
}

/* shared save routine — used by Progress Entry and the Structures layout */
function saveProgress(a, st, cum, date, after) {
  const rec = { date: date, actId: a.i, note: st.note || '', area: a.area, engineer: ST.user.id };
  if (st.mode === 'qty' && a.q) {
    const v = parseFloat(st.qty);
    if (!isFinite(v) || v === 0) { toast('Enter a quantity first', true); return false; }
    rec.qty = v; rec.mode = 'qty'; rec.unit = a.u;
    const nq = (cum ? cum.qty : 0) + v;
    if (nq > a.q * 1.0001) {
      ask('Over baseline quantity',
        'Entered cumulative ' + n2(nq) + ' ' + (a.u || '') + ' exceeds the baseline quantity ' + n2(a.q) +
        '. This will be flagged for the planner as a quantity variance — it is NOT capped silently. Save anyway?',
        () => { rec.overrun = 1; DB.put('progress', rec); toast('Saved (flagged as over-quantity)'); after && after(); }, 'Save & flag');
      return true;
    }
    DB.put('progress', rec);
  } else {
    const v = parseFloat(st.pct);
    if (!isFinite(v)) { toast('Enter a % first', true); return false; }
    rec.pct = Math.min(100, Math.max(0, v)); rec.mode = 'pct';
    const curPct = cum ? cum.a : 0;
    DB.put('progress', rec);
    if (rec.pct < curPct - 0.005 && cum && cum.qty > 0)
      toast('Saved — note: quantity entries already put this activity at ' + n2(curPct) + '%; the higher reading governs.');
  }
  toast('Progress saved — ' + a.i);
  after && after();
  return true;
}

function vLookahead(m) {

    el('div', { class: 'chips' }, [1, 2, 4, 6].map(w => chip(w + ' wk', wk === w, () => { ST.laWeeks = w; render(); })))));
  m.appendChild(filterBar(f, () => render()));
  m.appendChild(el('div', { style: 'height:11px' }));
  const la = lookahead(from, to, a => passes(a, f));
  const ix = actualIndex();
  if (!la.length) { m.appendChild(el('div', { class: 'empty' }, 'No open activities in this window.')); return; }
  const crit = la.filter(a => a.tf <= 0).length;
  const late = la.filter(a => a.es < from && !(ix[a.i] && ix[a.i].a > 0)).length;
  const g = el('div', { class: 'grid g4', style: 'margin-bottom:11px' });
  g.appendChild(kpi('Activities', String(la.length), 'Open in window'));

  g.appendChild(kpi('Not started, overdue', String(late), 'Baseline start has passed', late ? 'n' : 'g'));

    ['Activity ID', 'Description', 'Area', { t: 'Start', n: 1 }, { t: 'Finish', n: 1 }, { t: 'Dur', n: 1 },

/* ---------------- small form helpers ---------------- */
function fld(label, node) { return el('label', { class: 'f' }, [el('span', {}, label), node]); }
function inp(type, val, on, cls, ro) {
  const n = el('input', { type: type, class: cls || '' });
  n.value = val == null ? '' : val;
  if (ro) n.readOnly = true;
  if (on) n.addEventListener('input', () => on(n.value));
  return n;
}
function ta(val, on) { const n = el('textarea'); n.value = val || ''; n.addEventListener('input', () => on(n.value)); return n; }
function sel(opts, val, on) {
  const n = el('select');
  opts.forEach(o => {
    const v = typeof o === 'object' ? o.v : o, t = typeof o === 'object' ? o.t : o;
    const op = el('option', { value: v }, t); if (v === val) op.selected = true; n.appendChild(op);
  });
  if (on) n.addEventListener('change', () => on(n.value));
  return n;
}
function chip(t, on, fn) { return el('button', { class: 'chip' + (on ? ' on o' : ''), onclick: fn }, t); }
function uniq(a) { return Array.from(new Set(a)); }
function photoField(rec) {
  const wrap = el('div', { class: 'f' });
  wrap.appendChild(el('span', { style: 'display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#355056;margin-bottom:3px' }, 'Photos'));
  const strip = el('div', { class: 'row', style: 'gap:6px;margin-bottom:6px' });
  function draw() {
    strip.innerHTML = '';
    (rec.photos || []).forEach((p, i) => {
      const im = el('img', { class: 'ph', src: p.d, title: p.cap || '' });
      im.addEventListener('click', () => ask('Remove photo', 'Remove this photo?', () => { rec.photos.splice(i, 1); draw(); }, 'Remove'));
      strip.appendChild(im);
    });
  }
  draw();
  const file = el('input', { type: 'file', accept: 'image/*', capture: 'environment', style: 'display:none' });
  file.addEventListener('change', async () => {
    for (const f of file.files) {
      try {
        const d = await compressImage(f, 1100, 0.7);
        rec.photos = rec.photos || [];
        rec.photos.push({ d: d, cap: f.name, ts: new Date().toISOString() });
      } catch (e) { toast('Could not read photo', true); }
    }
    file.value = ''; draw();
  });
  wrap.appendChild(strip);
  wrap.appendChild(el('button', { class: 'btn sm', onclick: () => file.click() }, '📷 Add photo'));
  wrap.appendChild(file);
  return wrap;
}

  emp: 'Sharjah Roads & Transport Authority (SRTA)',   // Employer / Client
